name: Hub

on:
  pull_request:
    paths: ["index.html", "why.html", "assets/library.js", "tools/hub/**", "wordings/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm the hub list and related-wordings block match tools/hub/library.json
        run: python3 tools/hub/build_hub.py --check

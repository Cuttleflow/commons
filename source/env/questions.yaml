# Platform questions for the Environmental Liability wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.env namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.env.insured.name
    text: What is the insured's full legal name?
    type: text
    used_by: S
  - id: qs.env.insured.abn
    text: What is the insured's ABN?
    type: text (11 digits)
    used_by: S, A
  - id: qs.env.insured.anzsic_primary
    text: What is the insured's main business activity (ANZSIC 2006 class)?
    type: select (ANZSIC 2006 class, from the Exposure Engine activity search)
    used_by: A, S
  - id: qs.env.insured.principal_state
    text: In which state or territory is the insured's principal place of business?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.env.insured.years_trading
    text: How many years has the insured traded under its current ownership?
    type: number
    used_by: R
  - id: qs.env.exposure.turnover
    text: What is the insured's annual turnover from contracting work for the coming year?
    type: currency (AUD)
    used_by: R, A, S
  - id: qs.env.exposure.turnover_by_state
    text: What share of that turnover comes from each state or territory?
    type: repeating (state, percentage), totalling 100
    used_by: R
  - id: qs.env.exposure.activity_split
    text: What share of that turnover comes from each kind of work (Exposure Engine environmental activity)?
    type: repeating (activity, percentage), totalling 100
    used_by: R
  - id: qs.env.exposure.subcontracted_pct
    text: What percentage of the work is subcontracted?
    type: percentage
    used_by: R
  - id: qs.env.exposure.largest_contract_pct
    text: What percentage of turnover comes from the largest single contract?
    type: percentage
    used_by: E04
  - id: qs.env.contracts.project_cover_required
    text: Does a contract require project-specific pollution cover?
    type: yes/no
    used_by: E04
  - id: qs.env.ops.high_hazard_work
    text: Does any of the turnover come from tank installation or removal, asbestos or lead abatement, soil or groundwater remediation, or hazardous waste handling?
    type: yes/no
    used_by: A
  - id: qs.env.ops.asbestos_pct
    text: What percentage of turnover comes from asbestos removal or abatement?
    type: percentage
    used_by: A, E05
  - id: qs.env.ops.contaminated_land
    text: Does the insured work on land known or suspected to be contaminated?
    type: yes/no
    used_by: A
  - id: qs.env.ops.pfas_handling
    text: Does the insured use, store, handle or dispose of PFAS or firefighting foam?
    type: yes/no
    used_by: A
  - id: qs.env.ops.operates_waste_facility
    text: Does the insured own or operate a landfill or a waste treatment, storage or disposal facility?
    type: yes/no
    used_by: A
  - id: qs.env.ops.offshore_work
    text: Does the insured do any offshore work?
    type: yes/no
    used_by: A
  - id: qs.env.ops.usa_canada_work
    text: Does the insured do any work in the USA or Canada?
    type: yes/no
    used_by: A
  - id: qs.env.ops.arranges_waste_disposal
    text: Does the insured choose or arrange the sites where waste from its work is disposed of?
    type: yes/no
    used_by: E03
  - id: qs.env.ops.transports_dangerous_goods
    text: Does the insured transport dangerous goods or pollutants by road for its work?
    type: yes/no
    used_by: R, E02
  - id: qs.env.ops.bulk_fuel_or_chemicals
    text: Does the insured transport fuel or chemicals in bulk?
    type: yes/no
    used_by: E02
  - id: qs.env.controls.environmental_management_system
    text: Does the insured have a written environmental management system (for example certified to ISO 14001)?
    type: yes/no
    used_by: R
  - id: qs.env.site.pll_requested
    text: Do you want Site Pollution Legal Liability for sites the insured owns or occupies?
    type: yes/no
    used_by: A, S
  - id: qs.env.site.pre_existing_requested
    text: Do you want cover for pollution at those sites that began before the retroactive date?
    type: yes/no
    used_by: E01
  - id: qs.env.site.bi_requested
    text: Do you want business interruption cover while a site is closed for clean-up?
    type: yes/no
    used_by: E07
  - id: qs.env.history.claims_5y
    text: How many pollution or environmental claims, or clean-up notices, has the insured had in the last five years?
    type: number
    used_by: R, A
  - id: qs.env.history.epa_notices_5y
    text: Has the insured received any notice, direction, order, penalty or prosecution from an environment protection authority in the last five years?
    type: yes/no
    used_by: A
  - id: qs.env.history.known_conditions
    text: Is the insured aware of any pollution condition or circumstance that could give rise to a claim or clean-up costs?
    type: yes/no
    used_by: A
  - id: qs.env.history.prior_cpl_continuous
    text: Has the insured held contractors pollution liability insurance continuously before this policy?
    type: yes/no
    used_by: E06
  - id: qs.env.cover.limit
    text: What limit of liability do you want for each pollution condition and in the aggregate?
    type: select
    options: ['1000000', '2000000', '5000000']
    used_by: R, S
  - id: qs.env.cover.excess
    text: What excess do you want for each pollution condition?
    type: select
    options: ['5000', '10000', '25000']
    used_by: R, S
  - id: qs.env.cover.retro_years
    text: How many years before the start of the policy period is the retroactive date?
    type: select
    options: ['0', '1', '2', '3']
    used_by: R, S

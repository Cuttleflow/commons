# Platform questions for the Meridian Corporate Travel wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.gtr namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.gtr.insured.name
    text: What is the policyholder's legal name?
    type: text
    used_by: S
  - id: qs.gtr.insured.abn
    text: What is the policyholder's ABN?
    type: text
    used_by: A, S
  - id: qs.gtr.insured.state
    text: In which state or territory is the policyholder's head office?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.gtr.insured.employee_count
    text: How many people does the policyholder employ in Australia?
    type: number
    used_by: A, S
  - id: qs.gtr.persons.traveller_count
    text: How many directors, officers and employees are expected to travel in the policy period?
    type: number
    used_by: A, S
  - id: qs.gtr.persons.contractors
    text: Should contractors travelling on the policyholder's business be insured persons?
    type: yes/no
    used_by: S
  - id: qs.gtr.persons.family
    text: Should accompanying spouses, partners and dependent children be insured persons?
    type: yes/no
    used_by: R, S
  - id: qs.gtr.persons.non_employees
    text: Will consultants, board advisers or guests travel on the policyholder's business at its cost?
    type: yes/no
    used_by: E08
  - id: qs.gtr.persons.based_overseas
    text: Do any directors, officers or employees who travel live outside Australia?
    type: yes/no
    used_by: A, E10
  - id: qs.gtr.cover.territory
    text: Where will insured persons travel?
    type: select
    options: ['worldwide', 'australia_only']
    used_by: A, S, E09
  - id: qs.gtr.trips.plan
    text: For each destination region and usual trip length, how many return trips do you expect in the policy period? Add one row for each combination.
    type: repeating (region, trips, trip length)
    used_by: R, S
  - id: qs.gtr.trips.region
    text: Destination region for this row of the trip plan.
    type: select
    options: ['domestic', 'pacific', 'asia', 'europe', 'rest_of_world']
    used_by: R, S
  - id: qs.gtr.trips.count
    text: Number of return trips to this region, of this length, expected in the policy period.
    type: number
    used_by: R, S
  - id: qs.gtr.trips.duration
    text: Usual length of these trips.
    type: select
    options: ['up_to_14', '15_to_31', '32_to_90', 'over_90']
    used_by: R, A
  - id: qs.gtr.trips.max_duration
    text: How long will the longest trip be?
    type: select
    options: ['up_to_31', '32_to_90', 'over_90']
    used_by: A, E06
  - id: qs.gtr.trips.do_not_travel
    text: Will anyone travel to a country or region for which DFAT advice is "do not travel"?
    type: yes/no
    used_by: A
  - id: qs.gtr.trips.high_risk
    text: Will anyone travel to a country or region for which DFAT advice is "reconsider your need to travel"?
    type: yes/no
    used_by: A
  - id: qs.gtr.trips.max_together
    text: What is the largest number of insured persons who will travel together on one flight or attend one event?
    type: number
    used_by: A
  - id: qs.gtr.trips.charter_flights
    text: Will insured persons fly on charter or non-scheduled aircraft, other than licensed charter flights to a destination served by no scheduled flight?
    type: yes/no
    used_by: A
  - id: qs.gtr.activities.manual_work
    text: Will any insured person do manual work on a construction, mining, oil and gas or engineering site, or work underground or offshore?
    type: yes/no
    used_by: E05
  - id: qs.gtr.activities.hazardous
    text: Will any insured person take part in an activity listed in the hazardous activities exclusion?
    type: yes/no
    used_by: E03
  - id: qs.gtr.medical.preexisting_declared
    text: Does any insured person want cover for a pre-existing medical condition?
    type: yes/no
    used_by: E01
  - id: qs.gtr.cover.leisure_days
    text: How many days of leisure travel before or after a business trip should be covered?
    type: select
    options: ['7', '14', '21']
    used_by: R, S, E02
  - id: qs.gtr.cover.directors_leisure
    text: Should directors and officers also be covered on leisure trips with no business purpose?
    type: yes/no
    used_by: R, S, E02
  - id: qs.gtr.cover.pandemic
    text: Do you want cover for disruption caused by an insured person's own diagnosis or quarantine in an epidemic or pandemic?
    type: yes/no
    used_by: E04
  - id: qs.gtr.cover.kidnap
    text: Do you want the kidnap, extortion and crisis response section?
    type: yes/no
    used_by: R, A, S
  - id: qs.gtr.limit.pa_capital
    text: What personal accident capital sum do you want for each insured person?
    type: select (AUD)
    options: ['250000', '500000', '1000000', '2000000']
    used_by: R, S, E07
  - id: qs.gtr.limit.cancellation
    text: What cancellation and curtailment limit do you want for each insured person?
    type: select (AUD)
    options: ['10000', '25000', '50000', '100000']
    used_by: R, S
  - id: qs.gtr.limit.liability
    text: What personal liability limit do you want?
    type: select (AUD)
    options: ['1000000', '2500000', '5000000', '10000000', '20000000']
    used_by: R, S
  - id: qs.gtr.excess
    text: What excess do you want for the travel disruption, luggage, business expenses and personal liability sections?
    type: select (AUD)
    options: ['0', '100', '250', '500']
    used_by: R, S
  - id: qs.gtr.claims.count_3y
    text: How many travel insurance claims has the policyholder made in the last 3 years?
    type: number
    used_by: R, A
  - id: qs.gtr.claims.declined
    text: Has any insurer declined, cancelled or refused to renew travel insurance for the policyholder?
    type: yes/no
    used_by: A
  - id: qs.gtr.issuer.lloyds
    text: "Is the policy issued under a Lloyd's binding authority?"
    type: yes/no
    used_by: E11
  - id: qs.gtr.sbt.named_travellers
    text: "How many named travellers should the policy cover?"
    type: number
    used_by: R, A, S
  - id: qs.gtr.sbt.area
    text: "Which area should the policy cover?"
    type: select
    options: ["worldwide", "excl_americas", "australia_only"]
    used_by: R, S
  - id: qs.gtr.sbt.max_trip
    text: "What is the longest trip any named traveller will take?"
    type: select (days)
    options: ["30", "60", "90"]
    used_by: R, S
  - id: qs.gtr.sbt.oldest_age
    text: "How old is the oldest named traveller?"
    type: number (years)
    used_by: R, A
  - id: qs.gtr.sbt.family_cover
    text: "Should accompanying family members be covered?"
    type: select
    options: ["none", "some", "all"]
    used_by: R, S
  - id: qs.gtr.sbt.based_in_australia
    text: "Is the business based in Australia, and do all named travellers live in Australia?"
    type: yes/no
    used_by: A
  - id: qs.gtr.sbt.usa_mostly
    text: "Will most of the travel be to the United States?"
    type: yes/no
    used_by: A
  - id: qs.gtr.sbt.equipment_increase
    text: "Do you want higher business equipment limits?"
    type: yes/no
    used_by: R, E12
  - id: qs.gtr.exp.temporarily_employed
    text: "Are all assignees Australian residents whom you have sent to work outside Australia temporarily?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.lives
    text: "How many assignees and dependants should be covered?"
    type: number
    used_by: R, A, S
  - id: qs.gtr.exp.age_split
    text: "What share of the lives is in each age band?"
    type: repeating (age band, percentage; total 100)
    options: ["0_17", "18_29", "30_34", "35_39", "40_44", "45_49", "50_54", "55_59", "60_64", "65_74"]
    used_by: R
  - id: qs.gtr.exp.lives_65_74
    text: "Are any of the lives aged 65 to 74?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.lives_over_74
    text: "Are any of the lives aged 75 or over?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.area
    text: "Which area of cover do you want?"
    type: select
    options: ["asia", "worldwide_excl_usa", "worldwide"]
    used_by: R, S
  - id: qs.gtr.exp.plan
    text: "Which plan do you want?"
    type: select
    options: ["standard", "premier"]
    used_by: R, S
  - id: qs.gtr.exp.excess
    text: "What annual excess do you want for each insured person?"
    type: select (AUD)
    options: ["0", "500", "1500", "5000"]
    used_by: R, S
  - id: qs.gtr.exp.sanctioned_host
    text: "Is any host country subject to Australian autonomous sanctions?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.usa_resident
    text: "Is any assignee based in the USA?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.pregnant
    text: "Is any insured person pregnant now?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.long_assignment
    text: "Will any assignment last more than 5 years?"
    type: yes/no
    used_by: A
  - id: qs.gtr.exp.home_leave
    text: "Do you want cover for treatment during home leave in Australia?"
    type: yes/no
    used_by: R, E12
  - id: qs.gtr.exp.usa_travel
    text: "Will assignees travel to the USA from their host country?"
    type: yes/no
    used_by: R, E13
  - id: qs.gtr.exp.dental
    text: "Do you want routine dental and optical cover?"
    type: yes/no
    used_by: R, E14
  - id: qs.gtr.hrt.person_days
    text: "How many person-days will insured persons spend travelling in the policy period?"
    type: number
    used_by: R, A, S
  - id: qs.gtr.hrt.dfat_split
    text: "What share of person-days is at each DFAT advice level?"
    type: repeating (level, percentage; total 100)
    options: ["level_1", "level_2", "level_3", "level_4"]
    used_by: R, S
  - id: qs.gtr.hrt.level_3_4
    text: "Will anyone travel where DFAT advice is reconsider your need to travel or do not travel?"
    type: yes/no
    used_by: A
  - id: qs.gtr.hrt.role
    text: "What is the main role of the people travelling?"
    type: select
    options: ["office", "field", "fixed_site", "security"]
    used_by: R, S
  - id: qs.gtr.hrt.armed
    text: "Will anyone carry a weapon or take part in hostilities?"
    type: yes/no
    used_by: A
  - id: qs.gtr.hrt.sanctioned
    text: "Will anyone travel to a country under Australian autonomous sanctions?"
    type: yes/no
    used_by: A
  - id: qs.gtr.hrt.over_70_level_3_4
    text: "Will anyone aged 70 or over travel where DFAT advice is reconsider your need to travel or do not travel?"
    type: yes/no
    used_by: A
  - id: qs.gtr.hrt.training
    text: "Have all travellers to high-risk destinations completed hostile environment training?"
    type: yes/no
    used_by: A
  - id: qs.gtr.hrt.embedded
    text: "Will any journalist be embedded with an armed force?"
    type: yes/no
    used_by: E12
  - id: qs.gtr.hrt.evacuation_increase
    text: "Do you want a higher security evacuation limit?"
    type: yes/no
    used_by: E13

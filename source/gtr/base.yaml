summary: 'Annual cover for an organisation''s business travellers, in Australia and overseas: medical, accident, disruption, luggage, money, liability, kidnap and crisis, and rental vehicle excess, sold through brokers.'
supersedes: New wording. Derived from the Meridian Corporate Travel Insurance Policy Wording v1.0.0 (July 2026), published outside the Commons

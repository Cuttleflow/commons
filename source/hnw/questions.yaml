# Platform questions for the Private Client Home wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.hnw namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.hnw.insured.name
    text: What is the name of each person to be insured, or of the company or trustee that owns the home?
    type: text
    used_by: S
  - id: qs.hnw.insured.entity_type
    text: Who owns the home?
    type: select
    options: ['individual', 'joint', 'family_trust', 'company']
    used_by: A, S, E13
  - id: qs.hnw.insured.occupants
    text: If a company or the trustee of a trust owns the home, who lives in it?
    type: text
    used_by: S, E13
  - id: qs.hnw.insured.australian_resident
    text: Is each person to be insured, or each person who lives in the home, resident in Australia?
    type: yes/no
    used_by: A
  - id: qs.hnw.property.address
    text: What is the address of the home?
    type: text
    used_by: S
  - id: qs.hnw.property.in_australia
    text: Is the home in Australia?
    type: yes/no
    used_by: A
  - id: qs.hnw.property.state
    text: In which state or territory is the home?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: R, A, S, E04
  - id: qs.hnw.property.north_of_26th
    text: Is the home north of the 26th parallel of latitude (roughly north of Gympie in Queensland, and of Carnarvon in Western Australia)?
    type: yes/no
    used_by: A, E04
  - id: qs.hnw.property.hazard_zone
    text: What is the flood and storm hazard zone of the address, as the address lookup returns it?
    type: select
    options: ['low', 'moderate', 'high']
    used_by: R, A, E02
  - id: qs.hnw.property.bushfire_attack_level
    text: What is the bushfire attack level (BAL) of the land the home is on?
    type: select
    options: ['bal_low', 'bal_12_5_to_29', 'bal_40', 'bal_fz']
    used_by: A, E03
  - id: qs.hnw.property.construction
    text: What are the external walls mainly made of?
    type: select
    options: ['masonry', 'timber_mixed', 'other']
    used_by: R, A
  - id: qs.hnw.property.year_built
    text: In what year was the building completed?
    type: number (year)
    used_by: R, A
  - id: qs.hnw.property.heritage
    text: Is the building listed on a heritage register?
    type: yes/no
    used_by: A, E05
  - id: qs.hnw.property.good_repair
    text: Is the home in a good state of repair, with no unrepaired damage?
    type: yes/no
    used_by: A
  - id: qs.hnw.property.renovation
    text: Are building works costing more than $250,000, or affecting the structure, under way or planned in the next 12 months?
    type: yes/no
    used_by: A, E06
  - id: qs.hnw.property.security
    text: What security does the home have?
    type: select
    options: ['deadlocks_only', 'monitored_alarm', 'monitored_alarm_cctv']
    used_by: R, A
  - id: qs.hnw.occupancy.use
    text: How is the home used?
    type: select
    options: ['main_residence', 'second_home', 'tenanted']
    used_by: R, A, S
  - id: qs.hnw.occupancy.unoccupied_over_100_days
    text: Has the home been unoccupied for more than 100 days, or will it be in the next 100 days?
    type: yes/no
    used_by: A, E07
  - id: qs.hnw.occupancy.short_stay
    text: Is the home, or any part of it, let for short stays?
    type: yes/no
    used_by: A, E08
  - id: qs.hnw.occupancy.business_use
    text: Is the home used mainly for a business?
    type: yes/no
    used_by: A
  - id: qs.hnw.cover.building_sum_insured
    text: What is the building sum insured (the full cost of rebuilding)?
    type: currency
    used_by: R, A, S, E09
  - id: qs.hnw.cover.building_valuation_current
    text: Is the building sum insured based on a professional valuation of the rebuilding cost dated within the last three years?
    type: yes/no
    used_by: A, E09
  - id: qs.hnw.cover.extended_replacement
    text: Which extended replacement percentage do you choose?
    type: select
    options: ['25', '50']
    used_by: R, S, E01
  - id: qs.hnw.cover.contents_sum_insured
    text: What is the contents sum insured, not counting valuables insured separately?
    type: currency
    used_by: R, A, S
  - id: qs.hnw.cover.liability_limit
    text: Which limit of liability do you choose?
    type: select
    options: ['10000000', '20000000', '30000000']
    used_by: R, S
  - id: qs.hnw.cover.excess
    text: Which basic excess do you choose?
    type: select
    options: ['1000', '2500', '5000', '10000']
    used_by: R, S
  - id: qs.hnw.valuables.jewellery_watches_sum_insured
    text: What is the sum insured for jewellery and watches kept at the home or worn?
    type: currency
    used_by: R, S, E11
  - id: qs.hnw.valuables.jewellery_vault_sum_insured
    text: What is the sum insured for jewellery and watches kept in a vault?
    type: currency
    used_by: R, S, E10
  - id: qs.hnw.valuables.fine_art_sum_insured
    text: What is the sum insured for fine art?
    type: currency
    used_by: R, S
  - id: qs.hnw.valuables.antiques_sum_insured
    text: What is the sum insured for antiques and decorative arts?
    type: currency
    used_by: R, S
  - id: qs.hnw.valuables.collectables_sum_insured
    text: What is the sum insured for collectables?
    type: currency
    used_by: R, S
  - id: qs.hnw.valuables.wine_sum_insured
    text: What is the sum insured for wine?
    type: currency
    used_by: R, S
  - id: qs.hnw.valuables.instruments_sum_insured
    text: What is the sum insured for musical instruments?
    type: currency
    used_by: R, S
  - id: qs.hnw.valuables.other_valuables_sum_insured
    text: What is the sum insured for other valuables?
    type: currency
    used_by: R, S
  - id: qs.hnw.valuables.total_sum_insured
    text: What is the total of the valuables sums insured?
    type: currency
    used_by: A, S
  - id: qs.hnw.valuables.specified_items
    text: List each item to be specified, with its category, description, serial number if any, and value.
    type: repeating
    item_fields: ['category', 'description', 'serial', 'agreed_value', 'valuation_date']
    used_by: S
  - id: qs.hnw.valuables.highest_item_value
    text: What is the value of the most valuable single item, or pair or set?
    type: currency
    used_by: A, E12
  - id: qs.hnw.valuables.valuations_outstanding
    text: Is there any item worth $10,000 or more without a professional valuation, or a receipt, dated within the last three years?
    type: yes/no
    used_by: A, E12
  - id: qs.hnw.valuables.vault_name
    text: What is the name and address of the vault?
    type: text
    used_by: S, E10
  - id: qs.hnw.valuables.held_for_sale
    text: Is any item held for sale, held on consignment, or used in a business?
    type: yes/no
    used_by: A
  - id: qs.hnw.history.claims_5y
    text: How many home, contents or valuables claims have you made in the last five years?
    type: number
    used_by: R, A
  - id: qs.hnw.history.refused_or_cancelled
    text: In the last five years, has an insurer refused, cancelled or declined to renew insurance for you, or imposed special terms?
    type: yes/no
    used_by: A
  - id: qs.hnw.history.criminal_conviction
    text: In the last ten years, has anyone to be insured, or anyone who lives in the home, been convicted of an offence involving dishonesty, arson or malicious damage?
    type: yes/no
    used_by: A
  - id: qs.hnw.policy.interested_party
    text: Does a financier or anyone else have an interest in the home or in any item?
    type: yes/no
    used_by: S, E14
  - id: qs.hnw.policy.interested_party_name
    text: Who is the interested party, and what is their interest?
    type: text
    used_by: S, E14
  - id: qs.hnw.policy.lloyds_capacity
    text: Is the policy underwritten at Lloyd's? (Set by the issuer.)
    type: yes/no
    used_by: E15

# Platform questions for the Side A Directors and Officers wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.sa namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.sa.insured.name
    text: What is the company's full legal name?
    type: text
    used_by: S
  - id: qs.sa.insured.abn
    text: What is the company's ABN?
    type: text (11 digits)
    used_by: S, A
  - id: qs.sa.insured.principal_state
    text: In which state or territory is the company's principal place of business?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.sa.underlying.insurer
    text: Who is the insurer of the underlying directors' and officers' insurance?
    type: text
    used_by: S, A
  - id: qs.sa.underlying.limit
    text: What is the total limit of the underlying directors' and officers' insurance?
    type: currency (AUD)
    used_by: R, A, S
  - id: qs.sa.cover.limit
    text: What Side A limit do you need?
    type: select (AUD)
    options: ['1000000', '2000000', '3000000', '5000000', '10000000']
    used_by: R, S
  - id: qs.sa.cover.options_requested
    text: Which optional endorsements would you like a price for?
    type: multi-select
    options: ['E04']
    used_by: E04

# Platform questions for the Product Recall and Contamination wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.prc namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.prc.insured.name
    text: What is the insured's full legal name?
    type: text
    used_by: S
  - id: qs.prc.insured.abn
    text: What is the insured's ABN?
    type: text (11 digits)
    used_by: S, A
  - id: qs.prc.insured.anzsic_primary
    text: What is the insured's main business activity (ANZSIC 2006 class)?
    type: select (ANZSIC 2006 class, from the Exposure Engine activity search)
    used_by: A, S
  - id: qs.prc.insured.principal_state
    text: In which state or territory is the insured's principal place of business?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.prc.products.category
    text: What is the main category of the insured products (Exposure Engine product category)?
    type: select (CF_PRODUCT_CATEGORY)
    used_by: R, A, S
  - id: qs.prc.products.description
    text: Describe the insured products.
    type: text
    used_by: S
  - id: qs.prc.exposure.turnover
    text: What is the annual turnover from the insured products for the coming year?
    type: currency (AUD)
    used_by: R, A, S
  - id: qs.prc.products.role
    text: What is the insured's role for these products?
    type: select
    options: ['manufacturer', 'contract_manufacturer', 'ingredient_supplier', 'brand_owner', 'importer', 'distributor', 'retailer']
    used_by: R, E01
  - id: qs.prc.products.import_pct
    text: What percentage of the insured products is imported from manufacturers with no Australian presence?
    type: percentage
    used_by: R
  - id: qs.prc.products.major_retail
    text: Are the insured products sold under the insured's brand, or a retailer's own label, through major supermarket or retail chains?
    type: yes/no
    used_by: R, E02, E03
  - id: qs.prc.products.export_pct
    text: What percentage of turnover from the insured products comes from exports?
    type: percentage
    used_by: A
  - id: qs.prc.products.usa_canada_export
    text: Are any insured products sold in the USA or Canada?
    type: yes/no
    used_by: E04
  - id: qs.prc.products.infant_or_medical_food
    text: Do the insured products include infant formula, baby food or food for special medical purposes?
    type: yes/no
    used_by: A
  - id: qs.prc.products.high_risk_ready_to_eat
    text: Do the insured products include high-risk ready-to-eat foods (for example cooked meats, soft cheeses, raw seafood, sprouts or pre-cut salads)?
    type: yes/no
    used_by: A
  - id: qs.prc.products.excluded_lines
    text: Do the insured products include tobacco or vaping products, cannabis or cannabinoid products, firearms, ammunition or weapons, or aircraft parts?
    type: yes/no
    used_by: A
  - id: qs.prc.controls.batch_coding
    text: Are all insured products coded so that each production batch can be identified and traced?
    type: yes/no
    used_by: A, E06
  - id: qs.prc.controls.recall_plan
    text: Does the insured have a written recall plan (Food Standards Code Standard 3.2.2 for food businesses)?
    type: yes/no
    used_by: A
  - id: qs.prc.controls.mock_recall_12m
    text: Has the insured tested its recall plan with a mock recall in the last 12 months?
    type: yes/no
    used_by: R
  - id: qs.prc.controls.gfsi_certified
    text: Is the insured certified to a GFSI-benchmarked food safety scheme (SQF, BRCGS or FSSC 22000) or an equivalent quality scheme?
    type: yes/no
    used_by: R
  - id: qs.prc.controls.allergen_shared_lines
    text: Are allergen-containing products made on shared lines without validated cleaning?
    type: yes/no
    used_by: R, E05
  - id: qs.prc.cover.limit
    text: What limit of liability do you want, in the aggregate?
    type: select
    options: ['1000000', '2500000', '5000000']
    used_by: R, S
  - id: qs.prc.cover.retention
    text: What retention do you want for each insured event?
    type: select
    options: ['10000', '25000', '50000', '100000']
    used_by: R, S
  - id: qs.prc.cover.defective_requested
    text: Do you want the Defective Products section?
    type: yes/no
    used_by: A, S
  - id: qs.prc.history.recalls_5y
    text: How many recalls has the insured carried out in the last five years?
    type: number
    used_by: A
  - id: qs.prc.history.withdrawals_5y
    text: How many market withdrawals without a safety risk has the insured made in the last five years?
    type: number
    used_by: R
  - id: qs.prc.history.tampering_or_extortion_5y
    text: Has the insured had any malicious tampering or extortion threat in the last five years?
    type: yes/no
    used_by: A
  - id: qs.prc.history.known_issues
    text: Is the insured aware of any facts that could lead to a recall?
    type: yes/no
    used_by: A

summary: Ten-year, first-resort cover for relevant defects in the building elements of the common property of a new NSW residential apartment building, taken out by the developer for the owners corporation
  under s.211AA of the Strata Schemes Management Act 2015 (NSW). Not yet accepted by the Secretary as a form of decennial liability insurance.

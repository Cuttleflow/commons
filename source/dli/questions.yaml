# Platform questions for the Decennial Liability Insurance (New South Wales) wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.dli namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.dli.developer.name
    text: What is the developer's legal name?
    type: text
    used_by: S
  - id: qs.dli.developer.abn
    text: What is the developer's ABN?
    type: text
    used_by: S
  - id: qs.dli.developer.class2_projects
    text: How many Class 2 residential buildings has the developer completed in the last 10 years?
    type: number
    used_by: R, A
  - id: qs.dli.builder.name
    text: Who is the builder?
    type: text
    used_by: S
  - id: qs.dli.builder.licence
    text: Does the builder hold a NSW contractor licence for the work and the registrations the Design and Building Practitioners Act 2020 (NSW) requires?
    type: yes/no
    used_by: A
  - id: qs.dli.builder.class2_projects
    text: How many Class 2 residential buildings has the builder completed in the last 10 years?
    type: number
    used_by: R, A
  - id: qs.dli.builder.orders
    text: In the last 5 years, has the builder or the developer received a rectification order, stop work order or prohibition order, or had an occupation certificate withheld for defects?
    type: yes/no
    used_by: A
  - id: qs.dli.building.address
    text: What is the address of the building?
    type: text
    used_by: S
  - id: qs.dli.building.state
    text: In which state or territory is the building?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: A, S
  - id: qs.dli.building.class
    text: What is the building class under the Building Code of Australia?
    type: select
    options: ['class2', 'class2_mixed', 'other']
    used_by: A, S
  - id: qs.dli.building.strata_titled
    text: Will the building be strata titled, with the lots sold to separate owners?
    type: yes/no
    used_by: A
  - id: qs.dli.building.residential_lots
    text: How many residential lots will the building have?
    type: number
    used_by: A, S
  - id: qs.dli.building.commercial_lots
    text: How many non-residential lots will the building have (enter 0 if none)?
    type: number
    used_by: R, E04, S
  - id: qs.dli.building.storeys
    text: How many storeys will the building have above ground?
    type: number
    used_by: R, A, S
  - id: qs.dli.building.basement_levels
    text: How many basement levels will the building have?
    type: select
    options: ['none', 'one', 'two_plus']
    used_by: R
  - id: qs.dli.building.construction_type
    text: What is the main structural system?
    type: select
    options: ['concrete_frame', 'steel_frame', 'loadbearing_masonry', 'lightweight_timber', 'modular']
    used_by: R, E05
  - id: qs.dli.building.facade_system
    text: What is the main external wall system?
    type: select
    options: ['masonry_render', 'precast_concrete', 'fibre_cement_lightweight', 'metal_or_composite_cladding', 'curtain_wall_glazing']
    used_by: R, A
  - id: qs.dli.building.podium_over_habitable
    text: Is there a podium, roof terrace or balcony over habitable space or a car park?
    type: yes/no
    used_by: R
  - id: qs.dli.risk.non_compliant_products
    text: Will the building use any combustible external cladding, or any building product that is subject to a building product use ban?
    type: select
    options: ['no', 'yes', 'unknown']
    used_by: A
  - id: qs.dli.risk.waterproofing_verified
    text: Will waterproofing be installed by a licensed waterproofer, flood tested, and inspected by the technical inspector before it is covered?
    type: yes/no
    used_by: R
  - id: qs.dli.project.contract_value
    text: What is the estimated contract value of the building work, including GST and work the developer supplies directly?
    type: currency
    used_by: R, A, S
  - id: qs.dli.project.works_started
    text: Has construction started?
    type: yes/no
    used_by: A
  - id: qs.dli.project.expected_oc_date
    text: When is the occupation certificate expected?
    type: date
    used_by: S
  - id: qs.dli.project.tis_agreed
    text: Will the developer appoint the insurer's technical inspector from the design stage and follow the technical inspection plan?
    type: yes/no
    used_by: A
  - id: qs.dli.cover.excess
    text: Which excess for each relevant defect?
    type: select
    options: ['0', '2500', '5000', '10000']
    used_by: R, S
  - id: qs.dli.cover.indexation
    text: Should the sum insured be indexed each year?
    type: yes/no
    used_by: R, S
  - id: qs.dli.cover.alt_accommodation
    text: Is alternative accommodation cover (E01) required?
    type: yes/no
    used_by: R, E01, S
  - id: qs.dli.cover.lot_waterproofing
    text: Is cover for waterproofing in lots (E02) required?
    type: yes/no
    used_by: R, E02, S
  - id: qs.dli.tis.final_report_defects
    text: What does the final technical inspection report show?
    type: select
    options: ['not_issued', 'none_outstanding', 'outstanding_listed']
    used_by: E03, S

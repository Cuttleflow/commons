# Platform questions for the Tradies Package wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.trd namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.trd.business.trade
    text: What is the main trade of the business (ANZSIC 2006 class)?
    type: select
    options: ['3212', '3221', '3222', '3223', '3224', '3231', '3232', '3233', '3234', '3239', '3241', '3242', '3243', '3244', '3245', '3291', '3299', '7311', '7312', '7313']
    used_by: R, A, S, E06, E07, E09, E10
  - id: qs.trd.business.description
    text: Describe the work the business does.
    type: text
    used_by: S
  - id: qs.trd.business.main_state
    text: In which state or territory does the business mainly work?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: R, A, S
  - id: qs.trd.business.years
    text: How many years has the business been operating?
    type: number
    used_by: R
  - id: qs.trd.business.licence
    text: What is the trade licence number, if the trade needs one?
    type: text
    used_by: S
  - id: qs.trd.business.turnover
    text: What is the estimated annual turnover for the next 12 months?
    type: number (currency)
    used_by: R, A
  - id: qs.trd.business.workers
    text: How many people work in the business, including you, employees and apprentices?
    type: number
    used_by: A, S
  - id: qs.trd.business.subcontractor_pct
    text: What share of turnover do you pay to subcontractors (%)?
    type: number (percent)
    used_by: A, E11
  - id: qs.trd.business.goods_sold_pct
    text: What share of turnover comes from goods you sell or import without installing them (%)?
    type: number (percent)
    used_by: A
  - id: qs.trd.insured.lloyds_binder
    text: Is the policy placed with Lloyd's underwriters?
    type: yes/no
    used_by: E14
  - id: qs.trd.ops.max_height_m
    text: What is the greatest height above ground or floor level at which you work (metres)?
    type: number
    used_by: A, E02
  - id: qs.trd.ops.excavation
    text: Do you excavate, trench, bore or use powered equipment to break ground?
    type: yes/no
    used_by: E03, E04
  - id: qs.trd.ops.max_depth_m
    text: What is the greatest depth you excavate, trench or bore (metres)?
    type: number
    used_by: A, E03
  - id: qs.trd.ops.hot_work
    text: Do you weld, cut, grind, braze, solder or use an open flame away from your own premises?
    type: yes/no
    used_by: E01
  - id: qs.trd.ops.waterproofing
    text: Do you install, apply or repair waterproofing membranes?
    type: yes/no
    used_by: E05
  - id: qs.trd.ops.roof_work
    text: Do you open roofs, or remove or replace roof sheeting, tiles or flashing?
    type: yes/no
    used_by: E06
  - id: qs.trd.ops.gas_work
    text: Do you do gas fitting work?
    type: yes/no
    used_by: E07
  - id: qs.trd.ops.tree_work
    text: Do you fell, lop or remove trees?
    type: yes/no
    used_by: E08
  - id: qs.trd.ops.residential_work
    text: Do you do residential building work for which the law requires statutory home warranty insurance?
    type: yes/no
    used_by: A, E15
  - id: qs.trd.ops.statutory_cover_held
    text: Do you hold the statutory home warranty insurance (or eligibility) the law requires for that work?
    type: yes/no
    used_by: A, E15
  - id: qs.trd.ops.asbestos_removal
    text: Do you remove, encapsulate or dispose of asbestos?
    type: yes/no
    used_by: A
  - id: qs.trd.ops.high_risk_work
    text: Do you do demolition, erect scaffolding, or work on rail corridors, airports airside, mines, offshore or in hospital operating areas?
    type: yes/no
    used_by: A
  - id: qs.trd.cover.liability_limit
    text: Which public and products liability limit do you want?
    type: select
    options: ['5000000', '10000000', '20000000']
    used_by: R, S
  - id: qs.trd.cover.liability_excess
    text: Which liability excess applies to property damage claims?
    type: select
    options: ['500']
    used_by: S
  - id: qs.trd.cover.higher_limit_required
    text: Does a contract require a liability limit above $20,000,000?
    type: yes/no
    used_by: A
  - id: qs.trd.cover.named_principals
    text: Does a construction contract require a principal to be named on the policy?
    type: yes/no
    used_by: E12
  - id: qs.trd.cover.principal_list
    text: Which principals must be named, and under which contracts?
    type: list
    used_by: S
  - id: qs.trd.cover.tools_selected
    text: Do you want Tools and Portable Equipment cover?
    type: yes/no
    used_by: R, A
  - id: qs.trd.cover.tools_sum_insured
    text: What tools sum insured do you want?
    type: select
    options: ['0', '5000', '10000', '20000', '30000', '50000']
    used_by: R, A, S
  - id: qs.trd.cover.specified_tools
    text: Which tools worth more than $5,000 each should be listed, and their values?
    type: list
    used_by: S
  - id: qs.trd.cover.plant_selected
    text: Do you want Mobile Plant cover (hired-in plant, and plant you own)?
    type: yes/no
    used_by: R, A
  - id: qs.trd.cover.plant_sum_insured
    text: What is the total value of the mobile plant you own that you want insured?
    type: select
    options: ['0', '50000', '100000', '250000']
    used_by: R, S
  - id: qs.trd.cover.plant_items
    text: Which items of mobile plant do you own, and what is each worth?
    type: list
    used_by: S
  - id: qs.trd.cover.plant_financed
    text: Does a financier have an interest in any of the mobile plant?
    type: yes/no
    used_by: E13
  - id: qs.trd.cover.contract_works_selected
    text: Do you want Annual Contract Works cover?
    type: yes/no
    used_by: R, A
  - id: qs.trd.cover.largest_contract
    text: What is the largest contract value you expect in the next 12 months?
    type: number (currency)
    used_by: A
  - id: qs.trd.cover.tax_audit_selected
    text: Do you want Tax Audit cover?
    type: yes/no
    used_by: R
  - id: qs.trd.cover.payment_fraud_selected
    text: Do you want Payment Fraud and Cyber cover?
    type: yes/no
    used_by: R
  - id: qs.trd.cover.callback_procedure
    text: Do you confirm new or changed bank details by phoning a number you already hold before paying?
    type: yes/no
    used_by: S
  - id: qs.trd.cover.downtime_selected
    text: Do you want Vehicle Downtime cover?
    type: yes/no
    used_by: R, A
  - id: qs.trd.cover.linked_motor
    text: Are your work vehicles insured under a motor policy linked to this policy?
    type: yes/no
    used_by: A
  - id: qs.trd.cover.work_vehicles
    text: How many work vehicles does the business use?
    type: number
    used_by: A, S
  - id: qs.trd.history.claims_5yrs
    text: How many claims has the business made in the last 5 years?
    type: number
    used_by: R, A
  - id: qs.trd.history.largest_claim_5yrs
    text: What was the largest single claim in the last 5 years?
    type: number (currency)
    used_by: A
  - id: qs.trd.history.declined
    text: Has an insurer declined, cancelled or refused to renew the business's insurance, or imposed special terms?
    type: yes/no
    used_by: A
  - id: qs.trd.history.insolvency_or_licence
    text: Has the business or an owner been insolvent, or had a trade licence cancelled or suspended, in the last 5 years?
    type: yes/no
    used_by: A

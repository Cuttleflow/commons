# Platform questions for the Meridian Travel wording (individual, couple and family travel).
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.trv namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
questions:
  - id: qs.trv.policyholder.name
    text: What is the policyholder's full name?
    type: text
    used_by: S
  - id: qs.trv.policyholder.state
    text: In which state or territory does the policyholder live?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.trv.policy.type
    text: Who is travelling under this policy?
    type: select
    options: ['single', 'duo', 'family']
    used_by: R, S
  - id: qs.trv.traveller.oldest_age
    text: How old is the oldest traveller?
    type: number (years)
    used_by: R, A, E15
  - id: qs.trv.traveller.resident
    text: Do all travellers live in Australia and hold a Medicare card or a visa that lets them return?
    type: yes/no
    used_by: A
  - id: qs.trv.trip.region
    text: Where is the main destination of the trip?
    type: select
    options: ['pacific', 'asia', 'europe', 'rest_of_world', 'domestic']
    used_by: R, S, E05
  - id: qs.trv.trip.days
    text: How many days is the trip, from leaving home to returning?
    type: number (days)
    used_by: R, A, S
  - id: qs.trv.trip.type
    text: Is this cover for one trip or for every trip in a year?
    type: select
    options: ['single', 'annual']
    used_by: A, E04
  - id: qs.trv.trip.one_way
    text: Is the trip one way, or a working holiday?
    type: yes/no
    used_by: E06
  - id: qs.trv.trip.do_not_travel
    text: Is any destination subject to DFAT advice of "do not travel"?
    type: yes/no
    used_by: A
  - id: qs.trv.cover.plan
    text: Which plan do you want?
    type: select
    options: ['essentials', 'comprehensive', 'top']
    used_by: R, S
  - id: qs.trv.cover.excess
    text: Which excess do you want?
    type: select (AUD)
    options: ['0', '100', '250']
    used_by: R, S
  - id: qs.trv.medical.preexisting
    text: Does any traveller have a pre-existing medical condition they want covered?
    type: yes/no
    used_by: E01
  - id: qs.trv.medical.pregnant
    text: Will any traveller be pregnant during the trip?
    type: yes/no
    used_by: E09
  - id: qs.trv.cover.snow
    text: Do you want cover for skiing and snowboarding?
    type: yes/no
    used_by: R, E02
  - id: qs.trv.cover.adventure
    text: Will any traveller take part in an extreme activity, such as skydiving, bungee jumping or deep scuba diving?
    type: yes/no
    used_by: R, E03
  - id: qs.trv.cover.business
    text: Will any traveller attend business meetings or conferences?
    type: yes/no
    used_by: E07
  - id: qs.trv.cover.campervan
    text: Will you hire a campervan or motorhome over 4.5 tonnes or with more than 9 seats?
    type: yes/no
    used_by: E08
  - id: qs.trv.cover.pandemic
    text: Do you want cover for disruption caused by your own diagnosis or quarantine in an epidemic or pandemic?
    type: yes/no
    used_by: R, E10
  - id: qs.trv.cover.cfar
    text: Do you want cancel for any reason cover?
    type: yes/no
    used_by: R, E11
  - id: qs.trv.cover.electronics
    text: Do you want a higher limit for named portable electronics?
    type: yes/no
    used_by: R, E12
  - id: qs.trv.cover.wedding
    text: Are you travelling to a wedding or event you want cancellation cover for?
    type: yes/no
    used_by: E13
  - id: qs.trv.cover.golf
    text: Do you want golf cover?
    type: yes/no
    used_by: E14
  - id: qs.trv.issuer.lloyds
    text: "Is the policy issued under a Lloyd's binding authority?"
    type: yes/no
    used_by: E16
  - id: qs.trv.amt.area
    text: "Which area should the annual policy cover?"
    type: select
    options: ["worldwide", "excl_americas", "asia_pacific", "nz_pacific"]
    used_by: R, S
  - id: qs.trv.amt.max_trip_days
    text: "What is the longest trip you will take?"
    type: select (days)
    options: ["15", "30", "45", "60"]
    used_by: R, A, S
  - id: qs.trv.amt.screening_outcome
    text: "What was the outcome of medical screening?"
    type: select
    options: ["none", "accepted", "low", "mid", "high", "exclude", "decline"]
    used_by: R, A, S, E17, E18
  - id: qs.trv.amt.cruise
    text: "Will any trip be an ocean cruise?"
    type: yes/no
    used_by: R
  - id: qs.trv.amt.terminal_illness
    text: "Has any traveller been diagnosed with a terminal illness?"
    type: yes/no
    used_by: A
  - id: qs.trv.amt.against_medical_advice
    text: "Will any traveller travel against medical advice?"
    type: yes/no
    used_by: A
  - id: qs.trv.amt.awaiting_treatment
    text: "Is any traveller waiting for surgery, a specialist investigation or a test result?"
    type: yes/no
    used_by: A
  - id: qs.trv.glt.group_type
    text: "What kind of group is travelling?"
    type: select
    options: ["school", "tour", "sports_team", "other"]
    used_by: R, S, E17
  - id: qs.trv.glt.group_size
    text: "How many group members and supervisors are travelling?"
    type: number
    used_by: R, A, S
  - id: qs.trv.glt.trip_days
    text: "How many days is the group trip?"
    type: number (days)
    used_by: R, A, S
  - id: qs.trv.glt.destination
    text: "What is the main destination of the group trip?"
    type: select
    options: ["within_state", "interstate", "nz_pacific", "asia", "europe", "americas"]
    used_by: R, S
  - id: qs.trv.glt.itinerary
    text: "Has the group trip a written itinerary?"
    type: yes/no
    used_by: A
  - id: qs.trv.glt.supervision_ratio
    text: "Are there more than 12 students for each supervisor?"
    type: yes/no
    used_by: A
  - id: qs.trv.glt.dfat_high
    text: "Does the itinerary include a country or region where DFAT advice is reconsider your need to travel or do not travel?"
    type: yes/no
    used_by: A
  - id: qs.trv.glt.supervisor_over_75
    text: "Is any supervisor aged 75 or over?"
    type: yes/no
    used_by: A
  - id: qs.trv.glt.host_family
    text: "Will group members stay with host families?"
    type: yes/no
    used_by: E18
  - id: qs.trv.inb.medicare_eligible
    text: "Is any traveller an Australian citizen or permanent resident, or eligible for Medicare?"
    type: yes/no
    used_by: A
  - id: qs.trv.inb.visa_condition
    text: "Are you buying this policy to meet a visa condition that requires health insurance?"
    type: yes/no
    used_by: A
  - id: qs.trv.inb.in_australia_no_return
    text: "Is any traveller already in Australia without a booked return or onward ticket?"
    type: yes/no
    used_by: A
  - id: qs.trv.inb.home_country
    text: "In which country does the policyholder live?"
    type: text
    used_by: S
  - id: qs.trv.inb.stay_days
    text: "How many days will you be in Australia?"
    type: number (days)
    used_by: R, A, S
  - id: qs.trv.inb.plan
    text: "Which plan do you want?"
    type: select
    options: ["medical_only", "essentials", "comprehensive", "top"]
    used_by: R, S
  - id: qs.trv.inb.manual_work
    text: "Will any traveller do manual work on a working holiday?"
    type: yes/no
    used_by: A, E17
  - id: qs.trv.inb.extension
    text: "Is this an extension of an existing stay?"
    type: yes/no
    used_by: E18

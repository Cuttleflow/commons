regulatory_basis:
- topic: ASIC RG 126; claims handling and settling services (AFS licence required since 1 January 2022)
  status: Met through the FS base. Loss assessors and adjusters who do not decide claims are covered by the Risk,
    Safety and Claims Consultants PI wording.
  review_by: '2027-03-31'
- topic: Insurance Brokers Code of Practice; General Insurance Code of Practice
  status: Proposal question only.
  review_by: '2027-06-30'
proposal_questions:
- AFS licence or AR details and authorisations.
- Gross written premium by class, and under binders, with claims settlement authority limits.
- Number of authorised representatives.
- Trust account controls; Code of Practice subscription; design and distribution processes.
- AFCA complaints and ASIC breach reports in the last three years.
decisions:
- '2026-10-31: Insurance Intermediaries is built on a separate Financial Services PI base; underwriting agencies
  included (profession review approved 31 October 2026).'
- '2026-10-31: The June exclusion of client disclosures not confirmed in writing is deleted; disclosure advice is
  the main broker claim and is handled by questions.'
- '2026-10-31: Insurer insolvency excluded by default, with a buy-back.'

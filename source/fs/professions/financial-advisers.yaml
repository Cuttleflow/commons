regulatory_basis:
- topic: ASIC RG 126 (issued November 2024, updated December 2025), Table 4 and RG 126.39 to RG 126.50
  status: 'Minimum limit ($2m, or about retail revenue up to $20m): platform restriction. Defence costs in addition:
    FS base. AFCA awards and conciliated amounts: FS base AFCA Determinations extension. Fraud and dishonesty of
    officers, employees and representatives: FS base insuring clause and Representatives extension. Licensee and
    all representatives covered: Representatives extension. One automatic reinstatement: FS base. Retroactive cover
    to the start of the continuous series: FS base definition of Retroactive date. ASIC notifications not an admission:
    FS base Prior Known Circumstances exclusion. Switching advice covered: definition of professional services.
    Automatic run-off: not required (RG 126.36). Excess: platform referral above a level set by the agency (RG 126.44
    to 126.45).'
  review_by: '2027-03-31'
- topic: Corporations Act 2001 Part 7.7A (best interests duty, conflicted remuneration); qualified tax relevant
    providers (Tax Agent Services Act 2009)
  status: Breach giving rise to compensation is within the FS base insuring clause. Tax (financial) advice is a
    professional service.
  review_by: '2027-03-31'
- topic: Compensation Scheme of Last Resort
  status: Levies are not insured (FS base Non-Compensatory Payments exclusion). FY27 revised levy estimate $198.1m,
    mostly attributed to personal advice.
  review_by: '2027-06-30'
proposal_questions:
- Licence details, number of advisers and authorised representatives, and funds under advice.
- Revenue by advice area, including superannuation, SMSF, life risk and tax (financial) advice.
- Approved product list and research process; share of recommendations off the list.
- Managed discretionary accounts, geared strategies, related products, superannuation switching, lead generators.
- Exposure to the Shield Master Fund, First Guardian Master Fund or other products subject to mass complaints.
- AFCA complaints, ASIC breach reports and remediation programs in the last three years.
decisions:
- '2026-10-31: Financial Advisers drafted from first principles on the Financial Services PI base at the underwriter''s
  request (31 October 2026). The AGCS Financial Planners wording POL732AGCS (May 2014) was reviewed as a market
  benchmark only; no text was taken from it.'
- '2026-10-31: The approved product list is written into the definition of professional services, as in the better
  market wordings, and is not an exclusion or endorsement. Switching to an approved product and holding advice are
  always included. A licensee without an approved product list is scheduled as such.'

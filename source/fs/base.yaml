id: fs-base
title: Financial Services Professional Indemnity Insurance
class: FINANCIAL SERVICES PROFESSIONAL INDEMNITY INSURANCE
kicker: Meridian Commons · Financial Services Professional Indemnity
slug: financial-services-professional-indemnity
file_stem: Meridian_Financial_Services_Professional_Indemnity
doc_ref: 2026/FS/0001
version: 1.1.0-DRAFT
date: November 2026
draft: true
summary: Professional indemnity cover for Australian financial services and credit licensees and their representatives,
  written on a claims-made basis to meet ASIC RG 126 and RG 210.
regulatory_basis:
- topic: ASIC RG 126 — compensation arrangements for AFS licensees (Corporations Act 2001 s.912B; Corporations Regulations
    reg 7.6.02AAA)
  status: 'Minimum limit of $2 million any one claim and aggregate for licensees with retail revenue of $2 million
    or less, rising with revenue to $20 million: platform restriction on the limit. Representatives'' fraud and
    dishonesty: Representatives extension. AFCA awards: AFCA Determinations extension. One automatic reinstatement:
    base, unless the limit is at least twice the minimum. Defence costs in addition: base. Counsel to check against
    the current RG 126.'
  review_by: '2027-03-31'
- topic: ASIC RG 210 — compensation and insurance arrangements for credit licensees (National Consumer Credit Protection
    Act 2009 s.48)
  status: 'Minimum $2 million, scaling with consumer credit revenue to $20 million: platform restriction. EDR awards
    and representatives'' fraud: as for RG 126. Reasonable efforts to obtain 12 months automatic run-off: Credit
    Intermediaries endorsement.'
  review_by: '2027-03-31'
- topic: Compensation Scheme of Last Resort levies
  status: Not insured (Non-Compensatory Payments exclusion).
  review_by: '2027-06-30'

# Platform questions for the Umbrella Liability wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.umb namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.umb.insured.name
    text: What is the insured's full legal name?
    type: text
    used_by: S
  - id: qs.umb.insured.abn
    text: What is the insured's ABN?
    type: text (11 digits)
    used_by: S, A
  - id: qs.umb.insured.anzsic_primary
    text: What is the insured's main business activity (ANZSIC 2006 class), as rated on the primary public and products liability policy?
    type: select (ANZSIC 2006 class, from the Exposure Engine activity search)
    used_by: R, A, S
  - id: qs.umb.insured.principal_state
    text: In which state or territory is the insured's principal place of business?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.umb.insured.usa_canada_domicile
    text: Is any insured domiciled, incorporated or operating from premises in the USA or Canada?
    type: yes/no
    used_by: A
  - id: qs.umb.exposure.turnover
    text: What is the insured's annual turnover for the coming year?
    type: currency (AUD)
    used_by: A, S
  - id: qs.umb.exposure.usa_canada_pct
    text: What percentage of turnover comes from products exported to, or work carried out in, the USA or Canada?
    type: percentage
    used_by: A, E01
  - id: qs.umb.ops.asbestos_removal
    text: Does the insured remove, handle or dispose of asbestos?
    type: yes/no
    used_by: A
  - id: qs.umb.ops.aviation_products
    text: Does the insured make or supply products for use in aircraft, or own or operate aircraft (other than drones under 25 kg)?
    type: yes/no
    used_by: A
  - id: qs.umb.ops.offshore_oil_gas
    text: Does the insured do any work offshore or for oil and gas extraction?
    type: yes/no
    used_by: A
  - id: qs.umb.ops.tunnelling
    text: Does the insured do any tunnelling or underground construction?
    type: yes/no
    used_by: A
  - id: qs.umb.ops.rail_operations
    text: Does the insured operate trains or rail infrastructure, or work on or next to an operating railway?
    type: yes/no
    used_by: A
  - id: qs.umb.ops.pfas_manufacture
    text: Does the insured manufacture, blend or apply PFAS or products containing PFAS, including firefighting foam?
    type: yes/no
    used_by: A
  - id: qs.umb.underlying.ppl_insurer
    text: Who is the insurer of the primary public and products liability policy?
    type: text
    used_by: S, A
  - id: qs.umb.underlying.ppl_wording
    text: What is the wording and version of the primary public and products liability policy?
    type: text
    used_by: S
  - id: qs.umb.underlying.ppl_insurer_accepted
    text: Is the primary insurer on the agency's accepted list of underlying insurers, and is the primary policy available to be checked?
    type: yes/no
    used_by: A
  - id: qs.umb.underlying.ppl_occurrence_basis
    text: Is the primary public and products liability policy written on an occurrence basis?
    type: yes/no
    used_by: A
  - id: qs.umb.underlying.ppl_limit
    text: What is the limit of the primary public and products liability policy for any one occurrence (and its products aggregate)?
    type: select
    options: ['5000000', '10000000', '20000000']
    used_by: R, S
  - id: qs.umb.underlying.anchor_source
    text: Who provides the primary public and products liability premium used to rate this policy?
    type: select
    options: ['broker', 'underwriter', 'none']
    used_by: A
  - id: qs.umb.underlying.ppl_premium
    text: What is the annual premium of the primary public and products liability policy, before taxes and charges?
    type: currency (AUD)
    used_by: R
  - id: qs.umb.underlying.aggregate_eroded
    text: Has any aggregate limit of the underlying insurance been reduced by paid or reserved loss in its current period?
    type: yes/no
    used_by: A
  - id: qs.umb.underlying.motor_scheduled
    text: Should motor vehicle liability insurance for the insured's registered vehicles be scheduled as underlying insurance?
    type: yes/no
    used_by: R, S
  - id: qs.umb.underlying.heavy_vehicles
    text: How many heavy vehicles (over 4.5 tonnes gross vehicle mass, trailers and prime movers) does the insured operate?
    type: number
    used_by: R, A, E04
  - id: qs.umb.underlying.dangerous_goods
    text: Does the insured carry dangerous goods by road?
    type: yes/no
    used_by: A, E04
  - id: qs.umb.underlying.el_states
    text: Does the insured have employees in Western Australia, Tasmania, the Northern Territory or the ACT, where workers compensation (including common law liability) is insured privately?
    type: yes/no
    used_by: R, E05
  - id: qs.umb.underlying.sublimits_extension_requested
    text: Do you want this policy to sit above any sub-limit of the underlying insurance?
    type: yes/no
    used_by: E07
  - id: qs.umb.cover.limit
    text: What umbrella limit of liability do you want?
    type: select
    options: ['5000000', '10000000', '20000000']
    used_by: R, S
  - id: qs.umb.cover.sir
    text: What self-insured retention do you want for Coverage B?
    type: select
    options: ['10000', '25000', '50000']
    used_by: R, S
  - id: qs.umb.cover.excess_only_requested
    text: Do you want excess cover only, without Coverage B or the aggregate drop-down?
    type: yes/no
    used_by: R, E03
  - id: qs.umb.contracts.principal_insured_required
    text: Does a contract require you to include a principal or another party as an insured under this policy?
    type: yes/no
    used_by: E02
  - id: qs.umb.history.claims_5y
    text: How many liability claims (public, products, motor or employers' liability) has the insured had in the last five years?
    type: number
    used_by: R, A
  - id: qs.umb.history.large_claim_5y
    text: Has any liability claim in the last five years been paid or reserved at more than half the primary limit, or more than $250,000?
    type: yes/no
    used_by: A
  - id: qs.umb.history.uninsured_loss_5y
    text: In the last five years, has the insured had a liability loss that its primary liability insurance did not cover?
    type: yes/no
    used_by: E06
  - id: qs.umb.history.circumstances
    text: Is the insured aware of any occurrence or circumstance that could give rise to a claim above the primary limits?
    type: yes/no
    used_by: A

version: 1.1.0-DRAFT
date: November 2026
draft: true
summary: All-risks material damage and business interruption cover for medium and large commercial and industrial property in Australia, with a 67-endorsement library that also attaches to Mark IV and Mark V forms.
supersedes: Meridian Industrial Special Risks Policy Wording v1.0.0 (2026/PR/0001) and Endorsement Library v1.0.0 (2026/PR/0002), which were not published to the Commons.

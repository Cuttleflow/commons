# Platform questions for the Carriers Combined wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.ccl namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
- id: qs.ccl.operations.gfe
  text: What are your estimated gross freight earnings for the policy period?
  type: number
  used_by: R, S
- id: qs.ccl.operations.rating_basis
  text: Should the premium be worked out on gross freight earnings, or per vehicle for an operator with 1 to 3 powered units?
  type: select
  options:
  - GFE
  - VEH1
  - VEH2
  - VEH3
  used_by: R, A, S
- id: qs.ccl.operations.goods_split
  text: What goods do you carry, as a percentage of gross freight earnings?
  type: repeating (product category, percentage; total 100)
  used_by: R, A, S
- id: qs.ccl.operations.radius
  text: What is your main operating radius?
  type: select
  options:
  - LOCAL
  - INTRA
  - INTER
  used_by: R, S
- id: qs.ccl.operations.powered_units
  text: How many powered units do you operate?
  type: number
  used_by: A, S
- id: qs.ccl.operations.subcontract_pct
  text: What percentage of your gross freight earnings is carried by subcontractors?
  type: number
  used_by: R
- id: qs.ccl.operations.years_trading
  text: How many years has the business traded under its current ownership?
  type: number
  used_by: R, A
- id: qs.ccl.operations.principal_state
  text: In which state or territory is your main depot?
  type: select
  options:
  - NSW
  - VIC
  - QLD
  - WA
  - SA
  - TAS
  - ACT
  - NT
  used_by: S
- id: qs.ccl.operations.refrigerated_goods
  text: Do you carry refrigerated goods?
  type: boolean
  used_by: A, E02
- id: qs.ccl.operations.livestock
  text: Do you carry livestock?
  type: boolean
  used_by: A, E01
- id: qs.ccl.operations.household_removals
  text: Do you carry household removals?
  type: boolean
  used_by: A, E03
- id: qs.ccl.operations.dangerous_goods
  text: Do you carry dangerous goods in packages?
  type: boolean
  used_by: A, E04
- id: qs.ccl.operations.bulk_dangerous_goods
  text: Do you carry dangerous goods in bulk?
  type: boolean
  used_by: A
- id: qs.ccl.operations.sea_leg
  text: Do your transits include a sea leg to Tasmania or another Australian island?
  type: boolean
  used_by: E05
- id: qs.ccl.operations.depot_max_value
  text: What is the most value of goods you hold at any one depot at one time?
  type: number
  used_by: A, E06
- id: qs.ccl.operations.storage_over_30_days
  text: Do you hold goods at a depot for more than 30 days?
  type: boolean
  used_by: A, E09
- id: qs.ccl.operations.trading_conditions_approved
  text: Do you use written terms of carriage that limit your liability, and has the insurer approved them?
  type: boolean
  used_by: A, E08
- id: qs.ccl.operations.subcontractors_uninsured
  text: Do any subcontractors carry for you without their own carriers' insurance?
  type: boolean
  used_by: A
- id: qs.ccl.cover.limit_vehicle
  text: What limit any one vehicle do you need?
  type: select
  options:
  - 50000
  - 100000
  - 250000
  - 500000
  - 1000000
  used_by: R, A, S
- id: qs.ccl.cover.excess
  text: What excess do you choose?
  type: select
  options:
  - 500
  - 1000
  - 2500
  - 5000
  - 10000
  used_by: R, S
- id: qs.ccl.cover.standard_perils
  text: Do you want the Standard Perils section (theft, non-delivery, loading and unloading, rainwater, shedding of load)?
  type: boolean
  used_by: R, S
- id: qs.ccl.cover.comprehensive
  text: Do you want the Comprehensive section (accidental loss or damage to all goods)?
  type: boolean
  used_by: R, A, S
- id: qs.ccl.cover.nominated_clients
  text: Do you want accidental damage cover for nominated clients or commodities?
  type: boolean
  used_by: R, A, E07
- id: qs.ccl.cover.refrigeration_breakdown
  text: Do you want Refrigeration Breakdown cover?
  type: boolean
  used_by: R, A, S
- id: qs.ccl.cover.legal_liability
  text: Do you want Legal Liability cover?
  type: boolean
  used_by: R, A, S, E08
- id: qs.ccl.history.claims_count3y
  text: How many losses have you had in the last 3 years?
  type: number
  used_by: R, A
- id: qs.ccl.history.driver_convictions
  text: Has any driver been convicted of a driving or dishonesty offence in the last 5 years?
  type: boolean
  used_by: A
- id: qs.ccl.history.prior_declined
  text: Has an insurer declined, cancelled or imposed special terms on carriers' insurance for you?
  type: boolean
  used_by: A

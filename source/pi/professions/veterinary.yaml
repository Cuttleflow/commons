regulatory_basis:
- topic: State and territory Veterinary Practitioners Acts (registration; national recognition of veterinary registration)
  status: Registration required by the definition of professional services and the base Licences condition. Whether
    any state requires PI as a condition of registration is still to be confirmed.
  review_by: '2027-03-31'
- topic: Animal welfare and biosecurity laws (notification duties)
  status: Fines and penalties excluded; defence costs covered (Animal Welfare and Biosecurity Penalties exclusion).
  review_by: '2027-03-31'
- topic: Export Control Act 2020 (accredited veterinarians for live export)
  status: Live export certification outside the definition; Live Export Certification Exclusion endorsement available.
  review_by: '2027-03-31'
proposal_questions:
- Registration of each veterinarian, by state.
- Species split and highest-value animal, herd or flock treated.
- Telehealth, compounding, gene therapy and reproductive services.
- Racing animals, pre-purchase examinations and live export certification.
decisions:
- '2026-10-31: Built on the PI base rather than a medical wording; not combined with public liability for now (profession
  review approved 31 October 2026).'
- '2026-10-31: High-value animal excess kept; artificial insemination and gene therapy handled by questions; care,
  custody and control write-back added.'
- '2026-11-02: Remediation following the pre-review of 2 November 2026; re-pinned to base 1.5.0-DRAFT. See the change file for 1.1.0.'

summary: Integrated professional indemnity wording for veterinary practices and registered veterinarians, built
  on the Meridian PI base wording.
base: pi-base@1.5.0-DRAFT
supersedes: MERIDIAN-PI-VETS-v1.0.0 (endorsement to base PI v1.0.0, June 2026)

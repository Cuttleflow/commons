regulatory_basis:
- topic: NSW — Property and Stock Agents Regulation 2022, s.12 (PI as a licence condition)
  status: 'Minimum $1,000,000 any one claim and $3,000,000 aggregate, including claimant costs. Required heads (negligence,
    misleading or deceptive conduct, breach of duty, unintentional defamation and IP infringement): base insuring
    clause. Vicarious fraud of employees and agents: Dishonesty of Employees and Agents extension. Permitted exclusion
    of commercial property over $10 million: endorsement. Platform restriction: a limit below the minimum refers.
    Counsel to confirm against the regulation text.'
  review_by: '2027-03-31'
- topic: Other states and territories
  status: Not yet researched. Base Compulsory Insurance Requirements condition applies.
  review_by: '2027-03-31'
- topic: Corporations Act 2001 — insurance distribution as an authorised representative
  status: Covered when shown in the schedule, through the base Financial Services exclusion carve-back.
  review_by: '2027-03-31'
proposal_questions:
- Licences and certificates by state, with numbers (state minimum limits are platform restrictions).
- Fees and commissions by activity; number of properties and strata lots managed.
- Trust money held and payment verification controls.
- Franchise agreement and franchisor name; rent rolls acquired.
- Underquoting complaints, penalties or actions in the last five years.
decisions:
- '2026-10-31: Conflict and financial-interest exclusions deleted (profession review approved 31 October 2026).'
- '2026-10-31: Payment redirection as a sub-limited broker option with a call-back condition.'
- '2026-10-31: Strata managers included.'
- '2026-10-31: Valuation exclusion narrowed to formal valuations; appraisals covered without a disclaimer condition.'

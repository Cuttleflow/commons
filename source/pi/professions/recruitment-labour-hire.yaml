regulatory_basis:
- topic: Labour hire licensing (Victoria, Queensland, South Australia, ACT)
  status: Licence required through the base Licences condition and the Labour Hire Licence Condition endorsement.
    Counsel to confirm which schemes are currently in force.
  review_by: '2027-03-31'
- topic: Fair Work Act — same job, same pay orders; superannuation guarantee and payday super (from 1 July 2026)
  status: 'Underpayments and employer debts are not compensatory loss (Wages, Superannuation and Employer Payments
    exclusion). Client payroll errors: Payroll Administration endorsement.'
  review_by: '2027-03-31'
- topic: Work health and safety penalties (NSW, WA, Queensland insurance bans)
  status: 'Not insured: base Statutory Liability extension.'
  review_by: '2027-03-31'
- topic: Migration Act 1958 — registered migration agents
  status: Migration advice excluded unless given by a registered agent (Migration Advice endorsement).
  review_by: '2027-03-31'
proposal_questions:
- Fees by activity; on-hire headcount.
- Pre-placement checks.
- Written on-hire agreements with hosts.
- Labour hire states and licence numbers.
- Payroll clients, high-risk placements, migration advice and automated screening.
decisions:
- '2026-10-31: Obstetric services definition and exclusion deleted; high-risk training exclusion replaced by the
  base Bodily Injury and Property Damage exclusion (profession review approved 31 October 2026).'
- '2026-10-31: On-hire cover as a broker option requiring written on-hire agreements.'
- '2026-10-31: Payroll errors as a sub-limited broker option.'
- '2026-11-02: Remediation following the pre-review of 2 November 2026; re-pinned to base 1.5.0-DRAFT. See the change file for 1.1.0.'

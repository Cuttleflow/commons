regulatory_basis:
- topic: Victoria — insurance required for endorsed building engineers (Building Act 1993 s.135; Building Practitioners'
    and Endorsed Building Engineers' Insurance Ministerial Order, in force 1 August 2021)
  status: Combustible cladding exclusion is an optional endorsement and does not apply where the Order does not
    permit it; Order text still to be read to confirm the engineers position
  review_by: 2027-01-31
- topic: Victoria — Architects Insurance Ministerial Order (2020)
  status: Met by the base Automatic Reinstatement provision (base 1.4.0); minimum limits are a schedule matter
  review_by: 2027-01-31
- topic: NSW — Design and Building Practitioners Act 2020 and Regulation 2021
  status: Met by the NSW Registered Practitioners extension (retroactive date = first registration for regulated
    work); building practitioner exemption extended to 30 June 2027
  review_by: 2027-06-30
- topic: Queensland — RPEQ Code of Practice; Board of Architects of Queensland Code
  status: Appropriate PI and disclosure to clients; no statutory minimum found
  review_by: 2027-06-30
- topic: Cadastral surveyors — registration with the state Surveyor-General or surveyors board
  status: Applied through the base Licences, Registrations and Accreditations condition
  review_by: '2027-06-30'
proposal_questions:
- Registration, licensing or endorsement held by each principal for each state in which you practise (architect,
  RPEQ, Victorian endorsed building engineer, NSW registered design practitioner or professional engineer).
- 'Subconsultants and subcontractors: fees paid to them in the last financial year; whether each holds its own professional
  indemnity insurance; whether your subcontracts require them to indemnify you.'
- Fees by activity, including any bridges, tunnels, dams, combustible cladding and mining-equipment work.
decisions:
- '2026-10-29: Subcontractor conditions handled as proposal questions only; base Subcontractors and Outsourcers
  extension unchanged.'
- '2026-10-29: Bridges and tunnels excluded only by optional endorsement.'
- '2026-10-29: Environmental engineering exclusion removed; base Pollution exclusion applies.'
- '2026-10-29: Combustible cladding exclusion provided as an optional endorsement only.'
- '2026-10-29: Registration required by law built into the definition of professional services.'
- '2026-10-29: Liquidated damages exclusion kept in the wording; mining-equipment warranty exclusion moved to an
  optional endorsement.'
- '2026-10-29: One automatic reinstatement built into the wording.'
- '2026-10-29: NSW registered practitioners: retroactive date treated as date of first registration for regulated
  work.'
- '2026-10-31: Land, cadastral, engineering and quantity surveying and town planning sit in this wording (Surveyors
  review, approved 31 October 2026). Building surveyors and certifiers have their own wording.'
- '2026-10-31: Automatic Reinstatement and the registration rule moved to the base wording (base 1.4.0).'

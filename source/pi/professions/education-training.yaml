regulatory_basis:
- topic: Standards for RTOs 2025 (from 1 July 2025), made under the National Vocational Education and Training Regulator
    Act 2011
  status: Registration required (definition of professional services). Re-assessment costs extension. Replaces the
    June references to ANTA standards.
  review_by: '2027-03-31'
- topic: TEQSA Act 2011; ESOS Act 2000 (tuition protection)
  status: Regulator inquiries covered (Education Regulators extension). Tuition protection amounts excluded (Fee
    Refunds exclusion).
  review_by: '2027-03-31'
- topic: 'Institutional abuse liability: Wrongs Act 1958 (Vic) s.91 and similar reverse-onus laws; AA v Trustees
    of the Roman Catholic Church for the Diocese of Maitland-Newcastle [2026] HCA 2'
  status: Abuse is excluded absolutely in this wording and belongs in a separate abuse liability product. Child
    safe question refers.
  review_by: '2027-03-31'
proposal_questions:
- Kinds of education provided and registrations held.
- Regulator audit outcomes in the last three years.
- Child safe compliance (referral to an abuse liability product).
- Third-party delivery, international students, VET Student Loans, high-risk practical training and enrolments.
decisions:
- '2026-10-31: EDUC and RTOO merged; abuse cover removed from PI (profession review approved 31 October 2026).'
- '2026-11-02: Remediation following the pre-review of 2 November 2026; re-pinned to base 1.5.0-DRAFT. See the change file for 1.1.0.'

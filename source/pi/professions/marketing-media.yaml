regulatory_basis:
- topic: Uniform defamation laws (Stage 1 serious harm threshold; Stage 2 digital intermediary reforms vary by state)
  status: Media Liability extension covers intentional publication without malice.
  review_by: '2027-03-31'
- topic: Privacy Act 1988 — statutory tort for serious invasions of privacy (from 10 June 2025)
  status: Media Liability extension, subject to the base Deliberate and Dishonest Acts exclusion.
  review_by: '2027-03-31'
- topic: Spam Act 2003; state trade promotion permits
  status: Penalties not insured where the law prohibits it (base Statutory Liability). Permit failures covered as
    negligence (Prizes and Over-Redemption exclusion carve-back).
  review_by: '2027-03-31'
proposal_questions:
- Fees by activity; largest audience.
- Pre-publication legal review; prior complaints and takedown demands.
- Live broadcasting and delay systems; user content and moderation.
- Investigative content, printing and proof sign-off, AI-generated content, United States audience.
decisions:
- '2026-10-31: Own product rather than cyber media cover; publication without malice covered (profession review
  approved 31 October 2026).'
- '2026-10-31: The June broadcast-delay, investigative-review and proof sign-off conditions became questions and
  endorsements.'
- '2026-11-02: Remediation following the pre-review of 2 November 2026; re-pinned to base 1.5.0-DRAFT. See the change file for 1.1.0.'

version: 1.0.0-DRAFT
date: October 2026
draft: true
summary: Integrated professional indemnity wording for WHS and risk consultants, loss adjusters, claims managers,
  investigators and injury management providers, built on the Meridian PI base wording.
base: pi-base@1.4.0-DRAFT
supersedes: MERIDIAN-PI-RISK-v1.0.0, and the consulting services in MERIDIAN-PI-OHS-v1.0.0 (endorsements to base
  PI v1.0.0, June 2026)
overrides:
- op: replace
  target: pi.def.professional-services
  with: pi.rs.def.professional-services
- op: add
  clause: pi.rs.ext.workplace-investigation-reports
  after: pi.ext.subcontractors-and-outsourcers
- op: add
  clause: pi.rs.excl.clinical-services
  after: pi.excl.bodily-injury-and-property-damage
- op: add
  clause: pi.rs.excl.fire-system-design
  after: pi.excl.products
- op: add
  clause: pi.rs.library.optional-endorsements
  after: pi.endorsement-library
- op: add
  clause: pi.rs.end.claims-handling-authorisation
  after: pi.rs.library.optional-endorsements
- op: add
  clause: pi.rs.end.surveillance
  after: pi.rs.end.claims-handling-authorisation
- op: add
  clause: pi.rs.end.psychosocial-hazards
  after: pi.rs.end.surveillance
- op: add
  clause: pi.rs.end.fire-safety-engineering
  after: pi.rs.end.psychosocial-hazards

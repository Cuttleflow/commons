regulatory_basis:
- topic: 'Work health and safety penalties: insurance prohibited in NSW (from 10 June 2020), WA (from 31 March 2022)
    and Queensland (from 28 March 2024)'
  status: 'Not insured: base Statutory Liability extension. The June OHS endorsement did not address this.'
  review_by: '2027-03-31'
- topic: Claims handling and settling services (AFS licence required from 1 January 2022; loss assessors and adjusters
    exempt)
  status: Deciding or settling claims covered only when scheduled, through the Claims Handling Authorisation endorsement
    and the base Financial Services exclusion carve-back.
  review_by: '2027-03-31'
- topic: State private investigator and security licensing; surveillance devices laws
  status: Licence required by the definition of professional services and the base Licences condition. Surveillance
    Exclusion endorsement available.
  review_by: '2027-03-31'
proposal_questions:
- Fees by activity.
- Investigator and security licences.
- Clinical services (decline and refer to the Allied Health wording).
- Claims decisions for insurers and AFS authorisation.
- Surveillance, psychosocial, fire safety engineering and expert witness work.
decisions:
- '2026-10-31: OHS consulting and RISK merged; clinical occupational health moved to the Allied Health wording (profession
  review approved 31 October 2026).'
- '2026-10-31: The June asbestos, nuclear and terrorism "replacements" are not carried over; the base exclusions
  apply.'
- '2026-10-31: Claims managers with settlement authority as their main business belong on the Insurance Intermediaries
  wording; adjusters stay here.'

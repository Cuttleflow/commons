regulatory_basis:
- topic: NSW — Design and Building Practitioners Act 2020 and Regulation 2021
  status: Registered design practitioners and professional engineers must hold PI. The requirement for registered building
    practitioners is deferred to 1 July 2027. Met by the NSW Registered Practitioners extension (retroactive date = first
    registration for regulated work); the terms prescribed for building practitioners are to be confirmed (WP REVIEW).
  review_by: 2027-06-30
- topic: NSW — s 37 duty of care, non-delegable under s 39 (Pafburn Pty Ltd v The Owners - Strata Plan No 84674 [2024] HCA 49)
  status: Developers and head contractors cannot rely on proportionate liability for the s 37 duty. Addressed by the Design
    Consultants and Subcontractors extension, and by the Apartment Buildings Sub-limit referral for Class 2 work.
  review_by: 2027-06-30
- topic: Queensland — QBCC licensing and the Queensland Building and Construction Commission Act 1991
  status: No statutory PI requirement found for licensed builders' design work; base Licences, Registrations and
    Accreditations condition applies
  review_by: 2027-06-30
proposal_questions:
- Revenue from construction contracts with design responsibility, by contract type, for the last and coming financial years,
  and total construction revenue.
- 'Design consultants: share of design they perform; whether each holds its own professional indemnity insurance; whether
  your subcontracts require them to indemnify you.'
- Class 2 buildings, number of storeys, external cladding, fitness-for-purpose warranties and excluded project types.
- 'Single-project cover: the project, its site, contract value, construction period, reporting period, and whether design
  or construction has started.'
decisions:
- '2026-11-27: New profession wording on the PI base (decision D1, Linear PLT-1405). Annual and single-project bases in one
  wording; the single-project basis is a section that applies only when the schedule shows it.'
- '2026-11-27: Design procured from design consultants is covered as the insured''s own (Design Consultants and Subcontractors
  extension), whether or not the consultant is insured; recovery rights preserved.'
- '2026-11-27: Workmanship and the insured''s own rectification costs excluded; a third party''s cost of rectifying work built
  to a defective design is covered; Design Rectification Costs extension sub-limited by default to one quarter of the limit.'
- '2026-11-27: Combustible cladding exclusion applies by default; removal refers (decision D9).'
- '2026-11-27: Class 2 buildings and buildings over three storeys refer through the Apartment Buildings Sub-limit (decision D9).'
- '2026-11-27: Single project: one aggregate limit for the whole period, no automatic reinstatement, premium fully earned from
  the start date (decision D7); an extension of the construction period needs our written agreement.'

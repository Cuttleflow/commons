version: 1.0.0-DRAFT
date: November 2026
draft: true
summary: Integrated professional indemnity wording for builders and trade contractors who take design responsibility
  under their construction contracts, on an annual basis or for a single project, built on the Meridian PI base wording.
base: pi-base@1.5.0-DRAFT
supersedes: None. New wording (Linear PLT-1405). The design and construct section of the Construction All Risks and
  Liability wording (2026/CARL/0001) is unchanged.

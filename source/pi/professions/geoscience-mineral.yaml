regulatory_basis:
- topic: JORC Code 2012 (through ASX and NZX listing rules); JORC Code 2026 in consultation
  status: Code-neutral public report condition in the definition of professional services. No compulsory PI.
  review_by: '2027-03-31'
- topic: VALMIN Code 2015
  status: Valuations covered; Mineral Asset Valuation Sub-limit endorsement available.
  review_by: '2027-03-31'
proposal_questions:
- 'Competent persons and specialists: reporting code and professional memberships.'
- Fees by activity, including public reports, valuations, petroleum, tailings and mine closure, and North American
  reporting.
- Largest project or capital raising connected with a report in the last three years (refer above $500 million).
- Overseas work by country (rating and sanctions screening).
decisions:
- '2026-10-31: Separate product (profession review approved 31 October 2026).'
- '2026-10-31: Public report excess is the greater of $10,000 and 0.25%, capped at $250,000, as an editable default.'
- '2026-10-31: Public report condition is code-neutral.'

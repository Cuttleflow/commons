# Platform questions that endorsement triggers depend on.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4): the platform question set uses the same IDs. Wording text here is the question as asked;
# the platform may add help text. Agency thresholds are set in the platform, not here.
questions:
  - id: qs.pi.practice_states
    text: In which states and territories do you provide professional services?
    type: multi-select (state or territory)
  - id: qs.pi.registrations
    text: For each principal, which registrations, licences or endorsements are held, and in which state or territory?
    type: repeating (principal, registration type, state, number)
  - id: qs.pi.activities.bridges_tunnels_pct
    text: What percentage of your fees in the last 12 months came from the design or construction of bridges or tunnels?
    type: percentage
  - id: qs.pi.activities.cladding_work
    text: Do you design, specify, select, certify or inspect external wall cladding, or advise on it?
    type: yes/no, with details
  - id: qs.pi.activities.mining_pct
    text: What percentage of your fees in the last 12 months came from services to the mining industry, including the design, specification or inspection of mining equipment?
    type: percentage
  - id: qs.pi.ae.cadastral_pct
    text: What percentage of your fees in the last 12 months came from cadastral or boundary surveys?
    type: percentage
    used_by: R, E (Run-off for Cadastral Surveys)
  - id: qs.pi.ae.depreciation_schedules
    text: Do you prepare tax depreciation schedules?
    type: yes/no
    used_by: E (Tax Depreciation Schedules)
  - id: qs.pi.ae.tpb_number
    text: If you prepare tax depreciation schedules, what is the Tax Practitioners Board registration number of the person or entity that signs them?
    type: text
    used_by: S, E (Tax Depreciation Schedules)
  - id: qs.pi.ae.hydrographic_pct
    text: What percentage of your fees in the last 12 months came from hydrographic surveys?
    type: percentage
    used_by: R, E (Hydrographic Surveys Exclusion)
  - id: qs.pi.bsc.first_registration_date
    text: For each principal, on what date were they first registered as a building surveyor or certifier, and in which state or territory?
    type: repeating (principal, state, date)
    used_by: S (Cover from First Registration; NSW retroactive date)
  - id: qs.pi.bsc.certifier_count
    text: How many registered certifiers or building surveyors does the practice employ or engage?
    type: number
    used_by: R, S (NSW minimum limit)
  - id: qs.pi.bsc.council_employee
    text: Are any of the certifiers to be insured employed by a local council and acting in that role?
    type: yes/no
    used_by: A (decline; council employees are exempt from the requirement and insured by the council)
  - id: qs.pi.bsc.qld_licence_expiry
    text: If you hold a Queensland building certifier licence, on what date does it expire?
    type: date
    used_by: S (timing of the Queensland cladding restriction)
  - id: qs.pi.bsc.disciplinary_history
    text: In the last five years, has any principal been the subject of a disciplinary finding, licence condition, suspension or audit finding by a building regulator?
    type: yes/no, with details
    used_by: R
  - id: qs.pi.bsc.class2_pct
    text: What percentage of your certificates in the last 12 months were for Class 2 (apartment) buildings?
    type: percentage
    used_by: R, E (Apartment Buildings Sub-limit)
  - id: qs.pi.bsc.max_storeys
    text: What is the greatest number of storeys of any building you have certified in the last three years?
    type: number
    used_by: R, E (Apartment Buildings Sub-limit)
  - id: qs.pi.bsc.ceasing_practice
    text: Does any principal intend to retire or cease practice in the next 12 months?
    type: yes/no
    used_by: E (Retirement Run-off)
  - id: qs.pi.bsc.pool_inspections
    text: Do you inspect or certify swimming pool or spa barriers?
    type: yes/no
    used_by: E (Pool Safety Inspections)
  - id: qs.pi.bsc.performance_solutions_pct
    text: What percentage of your approvals in the last 12 months included a fire safety performance solution?
    type: percentage
    used_by: R, E (Fire Performance Solutions Exclusion)
  - id: qs.pi.gm.competent_persons
    text: For each person who signs public reports, which reporting code do they sign under and which professional memberships do they hold?
    type: repeating (person, code, membership)
    used_by: S (definition of professional services)
  - id: qs.pi.gm.largest_project_value
    text: What is the largest project value or capital raising connected with a report you prepared or contributed to in the last three years?
    type: currency
    used_by: R (refer above $500 million)
  - id: qs.pi.gm.overseas
    text: What percentage of your fees come from projects outside Australia and New Zealand, and in which countries?
    type: percentage, with countries
    used_by: R (rating and sanctions screening)
  - id: qs.pi.gm.public_report_pct
    text: What percentage of your fees in the last 12 months came from public reports, including contributions to them?
    type: percentage
    used_by: R, E (Public Report Excess)
  - id: qs.pi.gm.petroleum_pct
    text: What percentage of your fees in the last 12 months came from the estimation of petroleum reserves or resources?
    type: percentage
    used_by: E (Petroleum Reserves Estimation)
  - id: qs.pi.gm.na_reports
    text: Do you prepare reports under Canadian NI 43-101 or US SEC Regulation S-K subpart 1300, or for projects in the USA or Canada?
    type: yes/no, with details
    used_by: E (North American Reporting Exclusion)
  - id: qs.pi.gm.tailings_pct
    text: What percentage of your fees in the last 12 months came from tailings storage, mine closure or rehabilitation work?
    type: percentage
    used_by: E (Tailings and Mine Closure Exclusion)
  - id: qs.pi.gm.valmin_pct
    text: What percentage of your fees in the last 12 months came from mineral asset valuations?
    type: percentage
    used_by: R, E (Mineral Asset Valuation Sub-limit)
  - id: qs.pi.es.accreditations
    text: Which accreditations does each assessor hold (for example NatHERS, BASIX, NABERS, Green Star, Commercial Building Disclosure), and with which body?
    type: repeating (person, scheme, accrediting body, number)
    used_by: S (base Licences, Registrations and Accreditations condition)
  - id: qs.pi.es.commercial_pct
    text: What percentage of your fees in the last 12 months came from commercial buildings?
    type: percentage
    used_by: R
  - id: qs.pi.es.supplier_interest
    text: Do you, or any principal, have a financial interest in a supplier or installer of products that you recommend?
    type: yes/no, with details
    used_by: R
  - id: qs.pi.es.installs_products
    text: Do you install products or equipment?
    type: yes/no
    used_by: R (installation is a public liability risk; decline if it is a material part of the business)
  - id: qs.pi.es.certificate_schemes_pct
    text: What percentage of your fees in the last 12 months came from creating certificates under an energy efficiency or renewable energy certificate scheme?
    type: percentage
    used_by: E (Energy Certificate Schemes Exclusion)
  - id: qs.pi.es.climate_reporting_pct
    text: What percentage of your fees in the last 12 months came from advice on climate-related financial disclosure?
    type: percentage
    used_by: E (Climate Disclosure Sub-limit)
  - id: qs.pi.es.solar_design
    text: Do you design solar photovoltaic or battery storage systems?
    type: yes/no
    used_by: E (Solar and Battery System Design)
  - id: qs.pi.es.solar_accreditation
    text: If you design solar or battery systems, which accreditation does the designer hold, and with which body?
    type: text
    used_by: E (Solar and Battery System Design)
  - id: qs.pi.ac.tpb_registration
    text: For each principal and the firm, what Tax Practitioners Board registration is held (tax agent, BAS agent, tax (financial) adviser) and what is the registration number?
    type: repeating (person or entity, registration type, number)
    used_by: S (base Licences, Registrations and Accreditations condition)
  - id: qs.pi.ac.tax_turnover
    text: What was your annual turnover from tax agent and BAS services in the last financial year?
    type: currency
    used_by: R (minimum limit under TPB(EP) 03/2010 is a platform restriction)
  - id: qs.pi.ac.scheme_membership
    text: Is the firm, or any principal, a member of a professional standards scheme? If so, which scheme and what is the scheme's monetary cap?
    type: yes/no, with scheme and cap
    used_by: R (limit must be at least the scheme requirement)
  - id: qs.pi.ac.trust_funds
    text: What is the largest amount of client or appointment money held at any one time?
    type: currency
    used_by: R
  - id: qs.pi.ac.registered_liquidator
    text: Is any principal a registered liquidator?
    type: yes/no
    used_by: E (Registered Liquidators)
  - id: qs.pi.ac.listed_audit_clients
    text: How many entities listed on a securities exchange, or regulated by APRA, do you audit or review?
    type: number
    used_by: R, E (Listed Entity Audits Exclusion)
  - id: qs.pi.ac.smsf_audits_count
    text: How many self-managed superannuation fund audits do you sign each year?
    type: number
    used_by: E (SMSF Audits Sub-limit)
  - id: qs.pi.ac.limited_afsl
    text: Do you, or any principal, give financial product advice under a limited AFS licence or as an authorised representative?
    type: yes/no, with licence or AR number
    used_by: E (Licensed Financial Advice)
  - id: qs.pi.ac.tfa_condition
    text: Does any principal's TPB registration carry a tax (financial) advice condition?
    type: yes/no
    used_by: E (Licensed Financial Advice)
  - id: qs.pi.ac.valuation_pct
    text: What percentage of your fees in the last 12 months came from business, share or asset valuations?
    type: percentage
    used_by: R, E (Valuations Sub-limit)
  - id: qs.pi.ac.crypto_clients_pct
    text: What percentage of your clients hold crypto-assets that you account for or report on?
    type: percentage
    used_by: E (Crypto-assets Exclusion)
  - id: qs.pi.re.licences
    text: For each state or territory in which you operate, which licences and certificates are held, by whom, and what are the numbers?
    type: repeating (state, person or entity, licence type, number)
    used_by: S (base Licences condition; state minimum limits are platform restrictions)
  - id: qs.pi.re.fee_split
    text: What percentage of your fees and commissions in the last 12 months came from sales, leasing, property management, strata management, stock and station agency, auctioneering and insurance distribution?
    type: repeating (activity, percentage)
    used_by: R
  - id: qs.pi.re.properties_managed
    text: How many properties do you manage?
    type: number
    used_by: R
  - id: qs.pi.re.franchise
    text: Do you operate under a franchise agreement that requires you to insure the franchisor? If so, name the franchisor.
    type: yes/no, with name
    used_by: S (Franchisor's Indemnity)
  - id: qs.pi.re.rent_roll_acquired
    text: Have you acquired a rent roll or strata management rights in the last three years, or do you plan to in the next 12 months?
    type: yes/no, with details
    used_by: S (Rent Roll Acquisitions)
  - id: qs.pi.re.underquoting
    text: In the last five years, has any principal or employee been the subject of a complaint, penalty or action about underquoting?
    type: yes/no, with details
    used_by: R
  - id: qs.pi.re.trust_money
    text: Do you hold client money in a trust account?
    type: yes/no
    used_by: E (Payment Redirection)
  - id: qs.pi.re.callback_verification
    text: Before paying trust money to new or changed account details, do you always confirm the details by calling the person on a telephone number you already hold?
    type: yes/no
    used_by: E (Payment Redirection)
  - id: qs.pi.re.commercial_over_10m_pct
    text: What percentage of your fees in the last 12 months came from commercial or industrial properties worth more than $10 million?
    type: percentage
    used_by: E (Commercial Property over $10 Million Exclusion)
  - id: qs.pi.re.strata_lots_managed
    text: How many strata or community scheme lots do you manage?
    type: number
    used_by: R, E (Strata Defects Advice Exclusion)
  - id: qs.pi.re.business_broking_pct
    text: What percentage of your fees in the last 12 months came from business broking?
    type: percentage
    used_by: E (Business Broking)
  - id: qs.pi.re.off_the_plan_pct
    text: What percentage of your sales in the last 12 months were off the plan?
    type: percentage
    used_by: R, E (Off-the-Plan Sales Sub-limit)
  - id: qs.pi.re.livestock_sales
    text: Do you conduct livestock sales?
    type: yes/no
    used_by: E (Livestock Sales Injury and Damage Exclusion)
  - id: qs.pi.rl.fee_split
    text: What percentage of your fees in the last 12 months came from permanent recruitment, contract and temporary placement, labour hire, executive search, testing, outplacement, HR consulting and payroll administration?
    type: repeating (activity, percentage)
    used_by: R
  - id: qs.pi.rl.onhire_headcount
    text: How many workers do you have on hire at any one time, on average?
    type: number
    used_by: R
  - id: qs.pi.rl.background_checks
    text: Which checks do you carry out before placing a candidate (references, qualifications, licences, right to work, police checks)?
    type: multi-select
    used_by: R
  - id: qs.pi.rl.onhire_pct
    text: What percentage of your fees in the last 12 months came from supplying workers on hire?
    type: percentage
    used_by: E (On-hired Workers)
  - id: qs.pi.rl.written_onhire_agreements
    text: Do you supply all on-hired workers under a written agreement with the host that places day-to-day supervision with the host?
    type: yes/no
    used_by: E (On-hired Workers)
  - id: qs.pi.rl.payroll_clients
    text: For how many clients do you run payroll, including paying wages or superannuation on their behalf?
    type: number
    used_by: E (Payroll Administration)
  - id: qs.pi.rl.high_risk_pct
    text: What percentage of your placements in the last 12 months were in mining, construction, heavy industry, aviation, maritime, healthcare or security roles?
    type: percentage
    used_by: E (High-Risk Placements Exclusion)
  - id: qs.pi.rl.labour_hire_states
    text: In which states and territories do you supply labour hire workers?
    type: multi-select (state or territory)
    used_by: E (Labour Hire Licence Condition)
  - id: qs.pi.rl.licence_numbers
    text: What are your labour hire licence numbers in each state or territory that requires one?
    type: repeating (state, number)
    used_by: E (Labour Hire Licence Condition)
  - id: qs.pi.rl.migration_advice
    text: Do you, or anyone acting for you, give migration advice or immigration assistance?
    type: yes/no
    used_by: E (Migration Advice)
  - id: qs.pi.rl.marn
    text: If so, what is the name and registration number (MARN) of each registered migration agent who gives it?
    type: repeating (name, MARN)
    used_by: E (Migration Advice)
  - id: qs.pi.rl.ai_screening
    text: Do you use automated tools, including artificial intelligence, to screen or rank candidates?
    type: yes/no, with details
    used_by: E (Automated Screening Exclusion)
  - id: qs.pi.rs.fee_split
    text: What percentage of your fees in the last 12 months came from WHS consulting, risk consulting, fire safety consulting, loss assessing and adjusting, claims management, workplace investigations, surveillance, injury management and training?
    type: repeating (activity, percentage)
    used_by: R
  - id: qs.pi.rs.investigator_licences
    text: Which investigator or security licences are held, by whom, and in which states?
    type: repeating (person, licence, state, number)
    used_by: S (base Licences condition)
  - id: qs.pi.rs.clinical_services
    text: Do you provide any medical, nursing, psychological or other clinical services, including fitness-for-work medical assessments?
    type: yes/no
    used_by: R (decline; refer to the Allied Health wording)
  - id: qs.pi.rs.claims_decisions
    text: Do you decide or settle insurance claims on behalf of insurers?
    type: yes/no
    used_by: E (Claims Handling Authorisation)
  - id: qs.pi.rs.afsl_or_ar
    text: If so, do you hold an AFS licence authorising claims handling and settling, or act as an authorised representative of a licensee? Give the number.
    type: yes/no, with number
    used_by: E (Claims Handling Authorisation)
  - id: qs.pi.rs.surveillance_pct
    text: What percentage of your fees in the last 12 months came from covert surveillance?
    type: percentage
    used_by: E (Surveillance Exclusion)
  - id: qs.pi.rs.psychosocial_pct
    text: What percentage of your fees in the last 12 months came from assessing or advising on psychosocial hazards?
    type: percentage
    used_by: E (Psychosocial Hazards Sub-limit)
  - id: qs.pi.rs.fire_engineering
    text: Do you provide fire safety engineering advice, including fire modelling or egress analysis?
    type: yes/no
    used_by: E (Fire Safety Engineering Exclusion)
  - id: qs.pi.rs.expert_witness
    text: Do you prepare expert reports for legal proceedings or give expert evidence?
    type: yes/no
    used_by: E (Expert Witness)
  - id: qs.pi.mm.fee_split
    text: What percentage of your fees in the last 12 months came from advertising and marketing, public relations, design, content production, publishing or broadcasting, research, media buying, trade promotions and influencer management?
    type: repeating (activity, percentage)
    used_by: R
  - id: qs.pi.mm.reach
    text: What is the largest audience reached by material you published or broadcast in the last 12 months?
    type: number
    used_by: R
  - id: qs.pi.mm.legal_review
    text: Is material that names or identifies people, or makes claims about competitors, reviewed by a lawyer before publication?
    type: yes/no
    used_by: R
  - id: qs.pi.mm.prior_complaints
    text: In the last five years, have you received a concerns notice, takedown demand or complaint alleging defamation, privacy invasion or infringement?
    type: yes/no, with details
    used_by: R
  - id: qs.pi.mm.live_broadcast
    text: Do you broadcast or stream material live?
    type: yes/no
    used_by: E (Live Broadcast Exclusion)
  - id: qs.pi.mm.delay_system
    text: If so, do you use a delay system that allows live material to be stopped before it reaches the audience?
    type: yes/no
    used_by: E (Live Broadcast Exclusion)
  - id: qs.pi.mm.ugc_platforms
    text: Do you operate or moderate a website, platform or channel on which other people can post material?
    type: yes/no
    used_by: E (User Content Exclusion)
  - id: qs.pi.mm.moderation
    text: If so, is posted material moderated, and is there a documented takedown process?
    type: yes/no
    used_by: E (User Content Exclusion)
  - id: qs.pi.mm.investigative_pct
    text: What percentage of your output in the last 12 months was investigative journalism or investigative content?
    type: percentage
    used_by: E (Investigative Content Sub-limit)
  - id: qs.pi.mm.printing
    text: Do you arrange printing for clients?
    type: yes/no
    used_by: E (Printing Errors)
  - id: qs.pi.mm.proof_signoff
    text: Do clients sign off a final proof before printing?
    type: yes/no
    used_by: E (Printing Errors)
  - id: qs.pi.mm.ai_content_pct
    text: What percentage of the content you deliver is generated wholly or mainly by artificial intelligence?
    type: percentage
    used_by: E (AI-Generated Content Exclusion)
  - id: qs.pi.mm.us_audience_pct
    text: What percentage of your audience, or your clients' audience for your material, is in the United States?
    type: percentage
    used_by: E (United States Audience Exclusion)
  - id: qs.pi.et.provider_type
    text: Which kinds of education do you provide (school, higher education, VET/RTO, tutoring, education agent), and what registration does each require?
    type: repeating (kind, regulator, registration number)
    used_by: S (definition of professional services)
  - id: qs.pi.et.audit_outcomes
    text: In the last three years, have you had a regulator audit finding of non-compliance, a registration condition, suspension or cancellation?
    type: yes/no, with details
    used_by: R
  - id: qs.pi.et.child_safe
    text: Do you teach or supervise children, and do you comply with the child safe standards in your state?
    type: yes/no, with details
    used_by: R (refer to an abuse liability product)
  - id: qs.pi.et.third_party_delivery_pct
    text: What percentage of your training or assessment is delivered by third parties under auspicing, partnership or licensing arrangements?
    type: percentage
    used_by: E (Third-Party Delivery Exclusion)
  - id: qs.pi.et.international_pct
    text: What percentage of your students are international students?
    type: percentage
    used_by: E (International Students Sub-limit)
  - id: qs.pi.et.vsl_approved
    text: Are you an approved VET Student Loans provider?
    type: yes/no
    used_by: E (VET Student Loans Exclusion)
  - id: qs.pi.et.high_risk_training
    text: Do you deliver practical training in high-risk work, such as high-risk work licences, working at heights, confined spaces, driving, aviation, maritime or firearms?
    type: yes/no
    used_by: E (High-Risk Practical Training Exclusion)
  - id: qs.pi.et.enrolments
    text: How many students were enrolled with you in the last 12 months?
    type: number
    used_by: R, E (Increased Re-assessment Sub-limit)
  - id: qs.pi.vt.registrations
    text: For each veterinarian, in which state or territory are they registered, and what is the registration number?
    type: repeating (person, state, number)
    used_by: S (definition of professional services)
  - id: qs.pi.vt.species_split
    text: What percentage of your work in the last 12 months was with companion animals, equine, livestock, wildlife and exotic animals, and racing animals?
    type: repeating (species group, percentage)
    used_by: R
  - id: qs.pi.vt.highest_value
    text: What is the highest value of any animal, herd or flock you treated in the last 12 months?
    type: currency
    used_by: R, S (High-Value Animals Excess)
  - id: qs.pi.vt.telehealth
    text: Do you give advice or consultations by telehealth, including to clients in other states?
    type: yes/no
    used_by: R
  - id: qs.pi.vt.compounding
    text: Do you compound veterinary medicines?
    type: yes/no
    used_by: R
  - id: qs.pi.vt.gene_therapy
    text: Do you provide genetic modification, gene therapy or cloning services?
    type: yes/no
    used_by: R (refer)
  - id: qs.pi.vt.racing_pct
    text: What percentage of your work in the last 12 months was with thoroughbreds, standardbreds or greyhounds in training, racing or bred for racing?
    type: percentage
    used_by: E (Racing Animals Excess)
  - id: qs.pi.vt.prepurchase_count
    text: How many pre-purchase or soundness examinations did you perform in the last 12 months?
    type: number
    used_by: E (Pre-purchase Examinations Sub-limit)
  - id: qs.pi.vt.reproductive_pct
    text: What percentage of your fees in the last 12 months came from artificial breeding and reproductive services?
    type: percentage
    used_by: E (Reproductive Services)
  - id: qs.pi.vt.live_export
    text: Do you inspect or certify animals for export, or accompany animals on export voyages?
    type: yes/no
    used_by: E (Live Export Certification Exclusion)
  # Cuttleflow Go PI templates (Linear PLT-637): the questions the shared PI rater, the referral rules and the schedule read.
  # Each Go package offers the subset of options for its profession (occupation codes are APRA NCPD PI occupation codes).
  - id: qs.pi.ac.activity_split
    text: Share of fees by activity
    type: repeating (activity, pct)
    used_by: R
    options:
    - acc.bookkeeping
    - acc.tax
    - acc.accounts
    - acc.management
    - acc.smsf_audit
    - acc.company_audit
    - acc.insolvency
    - acc.trusts_estates
    - acc.valuations
    - acc.financial_consulting
  - id: qs.pi.ae.activity_split
    text: Share of fees by activity
    type: repeating (activity, pct)
    used_by: R
    options:
    - ae.arch_residential
    - ae.arch_commercial
    - ae.interior
    - ae.landscape
    - ae.planning
    - ae.drafting
    - ae.civil
    - ae.structural
    - ae.building_services
    - ae.geotechnical
    - ae.environmental
    - ae.traffic
    - ae.quantity_surveying
    - ae.land_survey
    - ae.cadastral
    - ae.project_mgmt
  - id: qs.pi.bsc.activity_split
    text: Share of fees by activity
    type: repeating (activity, pct)
    used_by: R
    options:
    - bsc.class_1_10
    - bsc.class_2_9
    - bsc.inspections
    - bsc.reports
    - bsc.fire_safety_reports
  - id: qs.pi.common.claims_count_5y
    text: Claims made against the practice in the last 5 years
    type: number
    used_by: R, A
  - id: qs.pi.common.claims_incurred_5y
    text: Total paid and reserved on those claims ($)
    type: number
    used_by: A
  - id: qs.pi.common.costs_basis
    text: Defence costs
    type: select
    used_by: R
    options:
    - inclusive
    - in_addition
  - id: qs.pi.common.disciplinary_5y
    text: Any disciplinary proceeding or regulator action in the last 5 years?
    type: yes/no
    used_by: A
  - id: qs.pi.common.excess
    text: Excess, each claim
    type: select
    used_by: R
    options:
    - '2500'
    - '5000'
    - '10000'
    - '25000'

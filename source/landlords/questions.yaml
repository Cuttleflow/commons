# Platform questions for the Landlords wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.lld namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.lld.insured.name
    text: What is the name of each owner to be insured?
    type: text
    used_by: S
  - id: qs.lld.property.address
    text: What is the address of the rental property?
    type: text
    used_by: S
  - id: qs.lld.property.state
    text: In which state or territory is the property?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: R, A, S
  - id: qs.lld.property.north_of_26th
    text: Is the property north of the 26th parallel of latitude (roughly north of Gympie in Queensland, and of Carnarvon in Western Australia)?
    type: yes/no
    used_by: A
  - id: qs.lld.property.hazard_zone
    text: What is the natural hazard zone of the address (flood, storm and bushfire), as the address lookup returns it?
    type: select
    options: ['low', 'moderate', 'high']
    used_by: R, A
  - id: qs.lld.property.dwelling_type
    text: Is the property a house, a townhouse or villa, or a lot in a strata scheme?
    type: select
    options: ['house', 'townhouse', 'strata_lot']
    used_by: A, S
  - id: qs.lld.property.construction
    text: What are the external walls mainly made of?
    type: select
    options: ['masonry', 'timber_mixed', 'other']
    used_by: R, A
  - id: qs.lld.property.year_built
    text: In what year was the building completed?
    type: number (year)
    used_by: R, A
  - id: qs.lld.property.heritage
    text: Is the building listed on a heritage register?
    type: yes/no
    used_by: A, E10
  - id: qs.lld.property.good_repair
    text: Is the property in a good state of repair, with no unrepaired damage?
    type: yes/no
    used_by: A
  - id: qs.lld.property.renovation
    text: Are building works costing more than $50,000, or affecting the structure, under way or planned in the next 12 months?
    type: yes/no
    used_by: A, E08
  - id: qs.lld.cover.building_sum_insured
    text: What does it cost to rebuild the building (the building sum insured)? Enter 0 for a strata lot or if you do not want building cover.
    type: currency
    used_by: R, A, S, E07
  - id: qs.lld.cover.contents_sum_insured
    text: What does it cost to replace the contents you provide for the tenant (the contents sum insured)? Enter 0 if you do not want contents cover.
    type: currency
    used_by: R, A, S
  - id: qs.lld.cover.excess
    text: Which basic excess do you choose?
    type: select
    options: ['500', '1000', '2000', '5000']
    used_by: R, S
  - id: qs.lld.cover.liability_limit
    text: What limit of liability do you need?
    type: select
    options: ['20000000', '30000000']
    used_by: R, A, S
  - id: qs.lld.cover.accidental_damage
    text: Do you want to add accidental damage cover?
    type: yes/no
    used_by: R, E01
  - id: qs.lld.tenancy.management
    text: Is the property managed by a licensed property manager, or by you?
    type: select
    options: ['agent', 'self']
    used_by: R, A, E13
  - id: qs.lld.tenancy.agreement_type
    text: How is the property let?
    type: select
    options: ['residential_tenancy', 'short_stay', 'not_let']
    used_by: A, E04
  - id: qs.lld.tenancy.tenancy_type
    text: What kind of tenancy is it?
    type: select
    options: ['standard', 'rooming', 'student', 'supported']
    used_by: A, E05, E06
  - id: qs.lld.tenancy.weekly_rent
    text: What is the weekly rent?
    type: currency
    used_by: R, A, S, E02
  - id: qs.lld.tenancy.vacant_over_60_days
    text: Has the property been unoccupied for more than 60 days, or will it be in the next 60 days?
    type: yes/no
    used_by: A, E09
  - id: qs.lld.tenancy.arrears
    text: Is the current tenant more than 14 days behind in rent?
    type: yes/no
    used_by: A
  - id: qs.lld.tenancy.bond_lodged
    text: Is a bond lodged with the bond authority for the current tenancy?
    type: yes/no
    used_by: A
  - id: qs.lld.tenancy.pets_permitted
    text: Does the tenancy allow the tenant to keep pets?
    type: yes/no
    used_by: R, E03
  - id: qs.lld.history.claims_5y
    text: How many landlord or home insurance claims have you made for this property in the last five years?
    type: number
    used_by: R, A
  - id: qs.lld.history.refused_or_cancelled
    text: Has an insurer refused, cancelled or declined to renew insurance for you, or imposed special terms, in the last five years?
    type: yes/no
    used_by: A
  - id: qs.lld.history.criminal_conviction
    text: Has any owner to be insured been convicted of an offence of dishonesty, arson or malicious damage in the last ten years?
    type: yes/no
    used_by: A
  - id: qs.lld.policy.interested_party
    text: Does a financier or anyone else have an interest in the property that should be noted?
    type: yes/no
    used_by: S, E11
  - id: qs.lld.policy.interested_party_name
    text: Who is the interested party, and what is their interest?
    type: text
    used_by: S
  - id: qs.lld.policy.lloyds_capacity
    text: Is the policy underwritten at Lloyd's? (Answered by the platform from the binder.)
    type: yes/no
    used_by: E12

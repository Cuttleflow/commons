# Platform questions for the Pleasure Craft wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.mpc namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.mpc.insured.name
    text: What is the name of each person to be insured?
    type: text
    used_by: S
  - id: qs.mpc.insured.individual_owners
    text: Is the boat owned only by the individuals to be insured, and not by a company, trust or partnership?
    type: yes/no
    used_by: A
  - id: qs.mpc.use.private_only
    text: Is the boat used only for private recreation, and never for hire, charter, reward or any business?
    type: yes/no
    used_by: A
  - id: qs.mpc.use.liveaboard
    text: Does anyone live on the boat, permanently or for more than 30 days in a row?
    type: yes/no
    used_by: A, E09
  - id: qs.mpc.boat.type
    text: What type of boat is it?
    type: select
    options: ['tinny', 'runabout', 'pwc', 'power_cruiser', 'sail_yacht', 'other']
    used_by: R, A, S
  - id: qs.mpc.boat.make_model
    text: What are the make and model of the boat?
    type: text
    used_by: S
  - id: qs.mpc.boat.registration
    text: What is the boat's registration number, and its hull identification number if it has one?
    type: text
    used_by: S
  - id: qs.mpc.boat.imported_or_unregistered
    text: Was the boat privately imported, or is it unregistered where the law requires registration?
    type: yes/no
    used_by: A
  - id: qs.mpc.boat.year_built
    text: In what year was the boat built?
    type: number (year)
    used_by: S
  - id: qs.mpc.boat.hull_age
    text: How old is the hull, in whole years?
    type: number
    used_by: R, A, E06
  - id: qs.mpc.boat.length
    text: What is the boat's overall length, in metres?
    type: number
    used_by: A, S
  - id: qs.mpc.boat.hull_material
    text: What is the hull made of?
    type: select
    options: ['aluminium', 'fibreglass', 'timber', 'steel', 'ferro_cement', 'composite']
    used_by: A, S
  - id: qs.mpc.boat.motor_type
    text: What kind of motor does the boat have?
    type: select
    options: ['outboard', 'inboard', 'sterndrive', 'jet', 'none']
    used_by: S
  - id: qs.mpc.boat.horsepower
    text: What is the total horsepower of the motors?
    type: number
    used_by: S
  - id: qs.mpc.boat.over_powered
    text: Is the total power of the motors more than the maximum the hull manufacturer rates the boat for?
    type: yes/no
    used_by: A
  - id: qs.mpc.boat.max_speed
    text: What is the boat's maximum speed, in knots?
    type: number
    used_by: R, A, S
  - id: qs.mpc.boat.modified
    text: Have the boat or its motors been modified from the manufacturer's specification to increase speed or power?
    type: yes/no
    used_by: A
  - id: qs.mpc.boat.good_condition
    text: Is the boat seaworthy and in good condition, with no known defects or unrepaired damage?
    type: yes/no
    used_by: A
  - id: qs.mpc.boat.rigging_age
    text: For a sailing yacht, how old is the standing rigging, in whole years? Enter 0 if the boat is not a sailing yacht.
    type: number
    used_by: A, E07
  - id: qs.mpc.storage.state
    text: In which state or territory is the boat normally kept?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: S
  - id: qs.mpc.storage.address
    text: At what address, marina or mooring is the boat normally kept?
    type: text
    used_by: S
  - id: qs.mpc.storage.method
    text: How is the boat normally kept when it is not in use?
    type: select
    options: ['locked_garage', 'home_driveway', 'shared_complex', 'dry_stack', 'marina_berth', 'swing_mooring']
    used_by: R, A, S, E05
  - id: qs.mpc.storage.zone
    text: Between 1 November and 30 April, will the boat be kept or used north of latitude 26 degrees south (roughly north of Gympie, Queensland, or Carnarvon, Western Australia)?
    type: select
    options: ['southern', 'northern']
    used_by: R, A, E04, E05
  - id: qs.mpc.storage.mooring_inspected
    text: If the boat is kept on a swing mooring, has the mooring been inspected by a qualified mooring contractor in the last 12 months?
    type: select
    options: ['yes', 'no', 'not_applicable']
    used_by: A
  - id: qs.mpc.storage.security
    text: What anti-theft security does the boat have?
    type: select
    options: ['none', 'approved_device', 'tracker']
    used_by: R, S
  - id: qs.mpc.navigation.area
    text: Will the boat be taken beyond 250 nautical miles from the coast of the Australian mainland or Tasmania, or overseas?
    type: select
    options: ['within_limits', 'offshore_beyond']
    used_by: A, E08
  - id: qs.mpc.operator.age
    text: How old is the person who will operate the boat most often?
    type: number
    used_by: R, A
  - id: qs.mpc.operator.licence_years
    text: For how many years has that person held a boat licence?
    type: number
    used_by: R
  - id: qs.mpc.operator.licensed
    text: Does everyone who operates the boat hold the licence the law requires, including a personal watercraft licence for a personal watercraft?
    type: yes/no
    used_by: A
  - id: qs.mpc.operator.young_others
    text: Will anyone else under 25 operate the boat regularly?
    type: yes/no
    used_by: R
  - id: qs.mpc.cover.sum_insured
    text: What is the sum insured for the boat, including its motors, equipment, tender and trailer?
    type: currency
    used_by: R, A, S
  - id: qs.mpc.cover.valuation
    text: Do you want the boat insured for its market value or for an agreed value?
    type: select
    options: ['market_value', 'agreed_value']
    used_by: R, S
  - id: qs.mpc.cover.excess
    text: Which basic excess do you want?
    type: select
    options: ['250', '500', '1000', '2000']
    used_by: R, S
  - id: qs.mpc.cover.liability_limit
    text: Which limit of liability do you want?
    type: select
    options: ['10000000', '20000000']
    used_by: R, S
  - id: qs.mpc.cover.water_ski
    text: Do you want cover for liability to and for water-skiers and others towed by the boat?
    type: yes/no
    used_by: R, E03
  - id: qs.mpc.cover.racing
    text: Will the boat be raced, and how far from the start?
    type: select
    options: ['none', 'club_50nm', 'to_150nm', 'beyond_150nm']
    used_by: R, A, E01
  - id: qs.mpc.cover.lay_up_months
    text: How many months a year will the boat be laid up out of the water and not used?
    type: select
    options: ['0', '3', '6']
    used_by: R, E02
  - id: qs.mpc.history.claims_5y
    text: How many boat insurance claims have you made in the last five years?
    type: number
    used_by: R, A
  - id: qs.mpc.history.refused_or_cancelled
    text: In the last five years, has an insurer refused, cancelled or not renewed boat insurance for anyone to be insured, or imposed special terms?
    type: yes/no
    used_by: A
  - id: qs.mpc.history.criminal_conviction
    text: In the last five years, has anyone to be insured, or the main operator, been convicted of a criminal offence, or of a boating or driving offence involving alcohol or drugs?
    type: yes/no
    used_by: A
  - id: qs.mpc.policy.interested_party
    text: Do you want a financier or other interested party noted on the policy?
    type: yes/no
    used_by: E10
  - id: qs.mpc.policy.interested_party_name
    text: What is the name of the interested party, and their interest?
    type: text
    used_by: S
  - id: qs.mpc.policy.lloyds_capacity
    text: Is the policy underwritten at Lloyd's (set from the binder)?
    type: yes/no
    used_by: E11

# Platform questions for the Private Collections wording.
# IDs are Field Catalogue field_refs (SPEC-URE-001 §4) in the qs.pcl namespace. The platform question set uses the same IDs.
# used_by: R rating, A appetite or referral rule, S schedule, E## endorsement trigger. Every question is used by something.
# Agency thresholds are set in the platform, not here.
questions:
  - id: qs.pcl.insured.name
    text: What is the name of each person to be insured, or of the trustee?
    type: text
    used_by: S
  - id: qs.pcl.insured.owner_type
    text: Who owns the collection?
    type: select
    options: ['individual', 'joint', 'family_trust', 'smsf']
    used_by: A, S, E08
  - id: qs.pcl.insured.australian_resident
    text: Is each person to be insured, or the trustee, resident in Australia?
    type: yes/no
    used_by: A
  - id: qs.pcl.insured.smsf_related_party_storage
    text: If a self-managed superannuation fund owns the collection, will any item be kept in, or used at, the home of a fund member or a related party?
    type: yes/no
    used_by: A, E08
  - id: qs.pcl.premises.address
    text: What is the address where the collection is normally kept?
    type: text
    used_by: S
  - id: qs.pcl.premises.state
    text: In which state or territory are the premises?
    type: select
    options: ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'ACT', 'NT']
    used_by: R, S
  - id: qs.pcl.premises.dwelling_type
    text: What kind of building are the premises?
    type: select
    options: ['house', 'apartment', 'secure_apartment']
    used_by: R, S
  - id: qs.pcl.premises.security
    text: What security protects the collection at the premises?
    type: select
    options: ['none', 'monitored_alarm', 'alarm_and_safe']
    used_by: R, A, S, E03
  - id: qs.pcl.premises.unoccupied_over_60_days
    text: Have the premises been unoccupied for more than 60 days, or will they be in the next 60 days?
    type: yes/no
    used_by: A, E07
  - id: qs.pcl.collection.total_sum_insured
    text: What is the total value of the collection to be insured?
    type: currency
    used_by: R, A, S
  - id: qs.pcl.collection.category_split
    text: How is the total value split between the categories (percentages totalling 100)?
    type: repeating
    item_fields: ['category', 'pct']
    options: ['jewellery_watches', 'jewellery_vault', 'fine_art', 'antiques', 'collectables', 'wine', 'instruments', 'other_valuables']
    used_by: R, S
  - id: qs.pcl.collection.specified_items
    text: List each item to be specified, with its category, description, serial number if any, and value.
    type: repeating
    item_fields: ['category', 'description', 'serial', 'agreed_value', 'valuation_date']
    used_by: S
  - id: qs.pcl.collection.highest_item_value
    text: What is the value of the most valuable single item, or pair or set?
    type: currency
    used_by: A, E09
  - id: qs.pcl.collection.valuations_outstanding
    text: Is there any item worth $10,000 or more without a professional valuation, or a receipt, dated within the last three years?
    type: yes/no
    used_by: A, E09
  - id: qs.pcl.collection.vault_storage
    text: Are any jewellery or watches kept in a bank or commercial vault?
    type: yes/no
    used_by: A, S, E02
  - id: qs.pcl.collection.vault_name
    text: What is the name and address of the vault?
    type: text
    used_by: S
  - id: qs.pcl.collection.business_use
    text: Is any item held for sale, held on consignment, or used in a business?
    type: yes/no
    used_by: A
  - id: qs.pcl.collection.other_property
    text: Do you want to insure firearms, vehicles, cash, bullion, or digital assets?
    type: yes/no
    used_by: A
  - id: qs.pcl.collection.instruments_professional
    text: Is any musical instrument used to earn an income?
    type: yes/no
    used_by: A, E05
  - id: qs.pcl.collection.loans_and_exhibitions
    text: Will any item be lent to a gallery, museum or exhibition during the policy period?
    type: yes/no
    used_by: A, E06
  - id: qs.pcl.collection.wine_temperature
    text: Do you want cover for wine spoiled by a failure of cellar temperature control?
    type: yes/no
    used_by: E04
  - id: qs.pcl.cover.worldwide_all_categories
    text: Do you want every category covered anywhere in the world, not only jewellery, watches and other valuables?
    type: yes/no
    used_by: R, E01
  - id: qs.pcl.cover.overseas_travel_days
    text: About how many days a year do you travel overseas taking jewellery or watches with you?
    type: number
    used_by: R, A
  - id: qs.pcl.cover.excess
    text: Which excess do you choose?
    type: select
    options: ['0', '250', '500', '1000']
    used_by: R, S
  - id: qs.pcl.history.claims_5y
    text: How many claims for loss or damage to valuables have you made in the last five years?
    type: number
    used_by: R, A
  - id: qs.pcl.history.theft_claim_5y
    text: Was any of those claims for theft or burglary?
    type: yes/no
    used_by: A
  - id: qs.pcl.history.refused_or_cancelled
    text: In the last five years, has an insurer refused, cancelled or declined to renew insurance for you, or imposed special terms?
    type: yes/no
    used_by: A
  - id: qs.pcl.history.criminal_conviction
    text: In the last ten years, has anyone to be insured been convicted of an offence involving theft, fraud, dishonesty or criminal damage?
    type: yes/no
    used_by: A
  - id: qs.pcl.policy.interested_party
    text: Does a financier or anyone else have an interest in any item?
    type: yes/no
    used_by: S, E10
  - id: qs.pcl.policy.interested_party_name
    text: Who is the interested party, and in which items?
    type: text
    used_by: S
  - id: qs.pcl.policy.lloyds_capacity
    text: Is the policy underwritten at Lloyd's? (Set by the issuer.)
    type: yes/no
    used_by: E11
